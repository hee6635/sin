<style>
:root{--bg:#ffffff;--fg:#1f2328;--muted:#5b6370;--line:#e3e6ea;--accent:#7b5cf0}
@media (prefers-color-scheme:dark){:root{--bg:#14171c;--fg:#e8eaee;--muted:#a3a9b3;--line:#2a2f37;--accent:#a590ff}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.7 system-ui,-apple-system,"Noto Sans KR","Apple SD Gothic Neo",sans-serif}
main{max-width:640px;margin:0 auto;padding:48px 20px 64px}
h1{margin:0 0 8px;font-size:28px}
p{margin:8px 0}
.sub{color:var(--muted)}
ul{list-style:none;padding:0;margin:28px 0 0}
li{border-top:1px solid var(--line)}
li:last-child{border-bottom:1px solid var(--line)}
li a{display:flex;justify-content:space-between;padding:16px 4px;color:var(--fg);text-decoration:none;font-weight:700}
li a span{color:var(--accent)}
footer{margin-top:32px;color:var(--muted);font-size:14px}
a{color:var(--accent)}
</style>
</head>

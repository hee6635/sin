<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>+ 버튼 개선 시안</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:#e9ecf1;padding:24px;display:flex;gap:22px;justify-content:center}
.wrap{display:flex;flex-direction:column;align-items:center;gap:10px}
.cap{font-size:16.5px;font-weight:800;color:#1f2328;text-align:center;height:44px}
.cap small{display:block;font-size:12px;font-weight:500;color:#6b7280;margin-top:2px}
.phone{--fg:#1f2328;--muted:#8b919a;--line:#eceef1;--surface:#f5f6f8;--accent:#2f6bf0;--fam:#7b5cf0;--fam-bg:#f3f0ff;--fam-line:#d3c8ff;--my:#3a3d43;--my-bg:#f1f2f4;
  --day:#cbd8de;--night:#d9cbc6;--rest:#e0455c;--sun:#d64560;--sat:#3b6fd6;--today:#1f8f75;--today-bg:#e3f6f0;
  width:390px;height:844px;background:#fff;border-radius:28px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.12);position:relative;display:flex;flex-direction:column;color:var(--fg)}
.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.top{display:grid;grid-template-columns:96px 1fr 96px;align-items:center;padding:10px 8px 6px;background:#f7f7f8}
.top .l,.top .r{display:flex;gap:4px;align-items:center}.top .r{justify-content:flex-end}
.ib{width:40px;height:40px;display:grid;place-items:center;border-radius:50%;position:relative;color:var(--fg)}
.ib.hl{background:#fff;box-shadow:0 0 0 2px var(--fam)}
.bdg{position:absolute;top:3px;right:2px;min-width:17px;height:17px;border-radius:9px;background:var(--rest);color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center;padding:0 4px;border:2px solid #f7f7f8}
.mid{text-align:center}.mid b{font-size:24px;font-weight:800}.mid i{font-style:normal;color:var(--muted);font-size:20px;margin:0 6px}
.mid small{display:block;font-size:12px;color:var(--muted);font-weight:600}
.today{font-size:13px;font-weight:700;padding:0 6px}
.dow{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:12px;font-weight:600;padding:4px 0;background:#f7f7f8}
.dow .s{color:var(--sun)}.dow .t{color:var(--sat)}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));flex:1}
.c{border-right:1px solid var(--line);border-bottom:1.5px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:2px 2px 3px;gap:2px;position:relative}
.c:nth-child(7n){border-right:0}
.c .n{align-self:flex-start;font-size:12px;padding-left:4px}.c.s .n{color:var(--sun)}.c.t .n{color:var(--sat)}.c.out{background:#f4f5f7}.c.out>*{opacity:.4}
.c.today{background:var(--today-bg)}.c.today::after{content:"";position:absolute;inset:0;border:3px solid var(--today)}
.bd{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:13px;margin:3px 0 2px}
.bd.d{background:var(--day)}.bd.n{background:var(--night)}.bd.r{color:var(--rest);font-weight:600;font-size:12px}
.pl{width:100%;font-size:9px;line-height:13px;height:13px;border-radius:3px;padding:0 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl.my{background:var(--my-bg);color:var(--my);box-shadow:inset 0 0 0 1px #dfe2e6}.pl.fam{background:var(--fam);color:#fff;font-weight:700}
.nav{display:flex;background:#42424f;height:58px;flex:none}
.nav div{flex:1;display:grid;place-items:center;font-size:12px;color:#a7a7b4}.nav .on{color:#fff;font-weight:800}
.fab{position:absolute;right:16px;bottom:72px;width:50px;height:50px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:28px;font-weight:300;box-shadow:0 4px 14px rgba(47,107,240,.35);z-index:4}
.fab.x{background:#1f2328;transform:rotate(45deg)}
.dim{position:absolute;inset:0;background:rgba(0,0,0,.45);z-index:3}
.acts{position:absolute;right:16px;bottom:134px;display:flex;flex-direction:column;align-items:flex-end;gap:10px;z-index:4}
.act{display:flex;align-items:center;gap:10px}
.act span{background:#fff;border-radius:10px;padding:8px 12px;font-size:14px;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.act span small{display:block;font-size:11px;color:var(--muted);font-weight:500}
.act i{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-style:normal;box-shadow:0 2px 8px rgba(0,0,0,.2);color:#fff}
.tip{position:absolute;z-index:6;background:#1f2328;color:#fff;font-size:11.5px;font-weight:700;padding:6px 9px;border-radius:8px;white-space:nowrap}
.tip::after{content:"";position:absolute;top:-5px;width:10px;height:10px;background:#1f2328;transform:rotate(45deg)}
/* 시트 */
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:20px 20px 0 0;z-index:5;display:flex;flex-direction:column}
.sh-h{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 6px}.sh-h b{font-size:17px}
.tabs{display:flex;gap:6px;padding:8px 16px 10px;border-bottom:1px solid var(--line)}
.tab{height:30px;padding:0 12px;border-radius:15px;background:var(--surface);font-size:12.5px;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:4px}
.tab.on{background:var(--fg);color:#fff}
.tab em{font-style:normal;background:var(--rest);color:#fff;border-radius:8px;font-size:10px;padding:0 5px;margin-left:2px}
.feed{padding:4px 16px 16px;overflow:hidden}
.day{font-size:12px;font-weight:700;color:var(--muted);margin:12px 0 6px}
.ev{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.ev.new{background:linear-gradient(90deg,var(--fam-bg),#fff 70%);margin:0 -16px;padding:10px 16px}
.ev .av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;flex:none}
.ev .tx{flex:1;font-size:14px;line-height:1.4}.ev .tx b{font-weight:800}
.ev .tx small{display:block;font-size:11.5px;color:var(--muted);margin-top:2px}
.ev .q{background:var(--surface);border-radius:10px;padding:7px 10px;margin-top:6px;font-size:13px}
.ev .q.fam{background:var(--fam-bg);box-shadow:inset 3px 0 0 var(--fam)}
.btns{display:flex;gap:6px;margin-top:8px}.btns span{flex:1;height:34px;border-radius:10px;display:grid;place-items:center;font-size:12.5px;font-weight:800}
.st{font-size:11px;font-weight:800;padding:2px 8px;border-radius:9px;background:#fff5e0;color:#c98a00;margin-left:4px}
.nd{width:8px;height:8px;border-radius:50%;background:var(--fam);flex:none;margin-top:6px}
.seg{display:flex;background:var(--surface);border-radius:12px;padding:3px}
.seg span{flex:1;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;gap:5px;font-size:13.5px;font-weight:800;color:var(--muted)}
.seg span.on.fam{background:var(--fam);color:#fff}
.inp{border-radius:12px;padding:12px 14px;font-size:15px;min-height:90px;margin-top:10px;background:var(--fam-bg);box-shadow:inset 0 0 0 1.5px var(--fam-line)}
.datec{display:flex;gap:6px;margin:4px 0 12px}.datec span{height:34px;padding:0 12px;border-radius:17px;background:var(--surface);font-size:13px;font-weight:700;display:flex;align-items:center;color:var(--muted)}
.datec span.on{background:var(--fg);color:#fff}
.save{height:50px;border-radius:14px;background:var(--fam);color:#fff;font-weight:800;display:grid;place-items:center;margin-top:14px}
</style></head><body>
<script>
const I={
 gear:'<svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',
 share:'<svg class="ico" viewBox="0 0 24 24"><path d="M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7M16 6l-4-4-4 4M12 2v13"/></svg>',
 bell:'<svg class="ico" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0"/></svg>',
 memo:'<svg class="ico" viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>',
 swap:'<svg class="ico" viewBox="0 0 24 24"><path d="M17 1l4 4-4 4M3 11V9a4 4 0 0 1 4-4h14M7 23l-4-4 4-4M21 13v2a4 4 0 0 1-4 4H3"/></svg>',
 todo:'<svg class="ico" viewBox="0 0 24 24"><path d="M9 11l3 3L22 4M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>',
 dday:'<svg class="ico" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18M12 14v4M10 16h4"/></svg>'};
const P=['주','주','휴','휴','야','야','휴','휴'];const anchor=Date.UTC(2026,8,28);
const sh=d=>P[((Math.round((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())-anchor)/864e5))%8+8)%8];
const k=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const MY={'2026-10-07':'🔒 치과 2시','2026-10-29':'🔒 관리비'},FAM={'2026-10-13':'♥ 아빠 생신','2026-10-20':'♥ 에버랜드','2026-10-24':'♥ 장모님 생신'};
function hdr(hl){return `<div class="top"><div class="l"><div class="ib">${I.gear}</div><div class="ib ${hl==='share'?'hl':''}">${I.share}</div></div>
 <div class="mid"><i>‹</i><b>2026.10</b><i>›</i><small>4조2교대 C조</small></div>
 <div class="r"><span class="today">오늘</span><div class="ib ${hl==='bell'?'hl':''}">${I.bell}<span class="bdg">3</span></div></div></div>`;}
function cal(){let g='';for(let i=0;i<35;i++){const d=new Date(2026,8,27+i),kk=k(d),s=sh(d),w=d.getDay();
  g+=`<div class="c ${w===0?'s':w===6?'t':''} ${d.getMonth()!==9?'out':''} ${kk==='2026-10-11'?'today':''}"><div class="n">${d.getDate()}</div><div class="bd ${s==='주'?'d':s==='야'?'n':'r'}">${s}</div>${FAM[kk]?`<div class="pl fam">${FAM[kk]}</div>`:''}${MY[kk]?`<div class="pl my">${MY[kk]}</div>`:''}</div>`;}
 return `<div class="dow"><span class="s">일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span class="t">토</span></div><div class="grid">${g}</div>`;}
const nav='<div class="nav"><div class="on">근무일정</div><div>동료근무</div><div>알람</div><div>더 보기</div></div>';
const p1=`<div class="phone">${hdr('bell')}${cal()}<div style="height:56px;background:#fff;flex:none"></div><div class="fab">+</div>${nav}
 <div class="tip" style="top:62px;right:8px">가족 소식 3</div>
 <div class="tip" style="top:62px;left:44px">달력 공유</div></div>`;
const p2=`<div class="phone">${hdr()}${cal()}<div style="height:56px;background:#fff;flex:none"></div>${nav}<div class="dim"></div>
 <div class="acts">
  <div class="act"><span>메모 추가<small>나만 / 가족 골라서</small></span><i style="background:#7b5cf0">${I.memo}</i></div>
  <div class="act"><span>이번 달 할 일<small>장보기·준비물</small></span><i style="background:#f08c00">${I.todo}</i></div>
  <div class="act"><span>D-day 추가<small>기념일·연차</small></span><i style="background:#3b6fd6">${I.dday}</i></div>
 </div><div class="fab x">+</div></div>`;
const av=(t,bg,fg)=>`<div class="av" style="background:${bg};color:${fg}">${t}</div>`;
const p3=`<div class="phone">${hdr()}${cal()}${nav}<div class="dim"></div>
 <div class="sheet" style="top:70px"><div class="sh-h"><b>🔔 가족 소식</b><span style="font-size:13px;color:var(--muted);font-weight:700">모두 읽음</span></div>
 <div class="tabs"><span class="tab on">전체</span><span class="tab">근무 요청<em>1</em></span><span class="tab">가족 메모<em>2</em></span></div>
 <div class="feed"><div class="day">오늘</div>
  <div class="ev new">${av('아','#f3f0ff','#7b5cf0')}<div class="tx"><b>아내</b>님이 <b>10/24(토) 휴무</b>를 요청했어요<span class="st">대기</span>
    <div class="q">장모님 생신이라 24일에 쉴 수 있을까?</div>
    <div class="btns"><span style="background:#e3f6f0;color:#1f8f75">수락</span><span style="background:var(--surface)">보류</span><span style="background:#fde8eb;color:#e0455c">거절</span></div>
    <small>10분 전</small></div><div class="nd"></div></div>
  <div class="ev new">${av('아','#f3f0ff','#7b5cf0')}<div class="tx"><b>아내</b>님이 <b>10/13</b>에 가족 메모를 남겼어요<div class="q fam">아빠 생신 저녁 7시, 케이크는 내가 살게</div><small>1시간 전</small></div><div class="nd"></div></div>
  <div class="ev new">${av('아','#e8f0ff','#2f6bf0')}<div class="tx"><b>아빠</b>님이 가족 근무표에 참여했어요<small>3시간 전</small></div><div class="nd"></div></div>
  <div class="day">어제</div>
  <div class="ev">${av('엄','#f5f6f8','#8b919a')}<div class="tx"><b>엄마</b>님이 <b>10/20</b>에 가족 메모를 남겼어요<div class="q fam">애들 데리고 에버랜드 가기로 함</div><small>어제 21:40 · 읽음</small></div></div>
 </div></div></div>`;
const p4=`<div class="phone">${hdr()}${cal()}${nav}<div class="dim"></div>
 <div class="sheet"><div class="sh-h"><b>메모 추가</b><span style="font-size:18px">✕</span></div>
 <div style="padding:6px 16px 22px">
  <div style="font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:6px">날짜</div>
  <div class="datec"><span class="on">오늘 10.11</span><span>내일 10.12</span><span>📅 날짜 고르기</span></div>
  <div class="seg"><span>🔒 나만</span><span class="on fam">♥ 가족</span></div>
  <div class="inp">오늘 야간이라 저녁은 먼저 먹어 |</div>
  <div style="font-size:12px;color:var(--fam);margin-top:8px;text-align:center">♥ 가족 모두에게 보여요 · 알림이 가요</div>
  <div class="save">가족에게 남기기</div>
 </div></div></div>`;
document.body.innerHTML=`
<div class="wrap"><div class="cap">① 달력: 보는 건 위로<small>왼쪽 공유 · 오른쪽 🔔 가족 소식(배지) · 작아진 +</small></div>${p1}</div>
<div class="wrap"><div class="cap">② + 누르면: 만드는 것만<small>메모 · 할 일 · D-day</small></div>${p2}</div>
<div class="wrap"><div class="cap">③ 🔔 가족 소식<small>요청·메모·참여를 한곳에, 바로 수락/거절</small></div>${p3}</div>
<div class="wrap"><div class="cap">④ + › 메모 추가<small>날짜 · 나만/가족 골라 바로 쓰기</small></div>${p4}</div>`;
</script></body></html>

<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>설정 시안</title>
<style>
:root{--bg:#fff;--fg:#1b2130;--sub:#4a5262;--line:#eceef2;--tile:#f4f6f9;--ic:#2f4a8a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 -apple-system,"Noto Sans KR",sans-serif}
.w{max-width:390px;margin:0 auto;padding:16px 16px 30px}h1{font-size:24px;margin:2px 0 12px}
.sr{display:flex;align-items:center;gap:8px;background:var(--tile);border-radius:12px;padding:11px 12px;color:var(--sub);font-size:14px}
.ts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.t{background:var(--tile);border-radius:14px;padding:14px 6px 12px;display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center}
.ic{color:var(--ic);display:flex}.t b{font-size:14.5px;margin-top:4px}.t small{font-size:12px;color:var(--sub)}
.hd{font-size:13px;font-weight:700;color:var(--sub);margin:20px 2px 4px}
.r{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line)}
.tx{flex:1;min-width:0;display:flex;flex-direction:column}.tx b{font-size:15px;font-weight:600}.tx small{font-size:12.5px;color:var(--sub)}
.v{font-size:13px;color:var(--sub)}.ch{color:#9aa1ad;font-size:18px}

"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/></svg></span><b>위젯</b><small>칸 채우기</small></div><div class="t"><span class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 19H8a5 5 0 1 1 1-9.9A6 6 0 0 1 20.6 11 4 4 0 0 1 17.5 19z"/></svg></span><b>백업</b><small>4시간 전</small></div></div><div class="hd">더 보기</div><div class="r"><span class="ic"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg></span><div class="tx"><b>화면</b><small>칸 채우기 · 라이트 · 또렷하게 · 글자 보통</small></div><span class="v"></span><span class="ch">›</span></div><div class="r"><span class="ic"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.2a6.5 6.5 0 0 1 3.5 5.8"/></svg></span><div class="tx"><b>가족 목록 · 같이 쉬는 날</b></div><span class="v">1명</span><span class="ch">›</span></div><div class="r"><span class="ic"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3h4v2.5a1.5 1.5 0 0 0 3 0V3h4v7h-2.5a1.5 1.5 0 0 0 0 3H21v8h-7v-2.5a1.5 1.5 0 0 0-3 0V21H3v-8h2.5a1.5 1.5 0 0 0 0-3H3V3z"/></svg></span><div class="tx"><b>부가 기능</b></div><span class="v">5개 켜짐</span><span class="ch">›</span></div><div class="r"><span class="ic"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16.5" rx="2"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/><path d="M12 17.5s-3-1.8-3-3.6a1.5 1.5 0 0 1 3-.6 1.5 1.5 0 0 1 3 .6c0 1.8-3 3.6-3 3.6z"/></svg></span><div class="tx"><b>휴무일 · 기념일</b></div><span class="v">1개</span><span class="ch">›</span></div><div class="r"><span class="ic"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg></span><div class="tx"><b>근무 통계 · 수당</b></div><span class="v">대근 0일</span><span class="ch">›</span></div><div class="r"><span class="ic"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.8"/><path d="M21 15l-5-5L5 21"/></svg></span><div class="tx"><b>달력 이미지로 공유</b></div><span class="v"></span><span class="ch">›</span></div><div class="r"><span class="ic"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 7.5h.01"/></svg></span><div class="tx"><b>도움 · 정보</b><small>문의 · 개인정보 · 데이터 지우기</small></div><span class="v">v0.134</span><span class="ch">›</span></div><div class="r"><span class="ic"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg></span><div class="tx"><b>이럴 땐 이렇게</b><small>상황별 사용법 · 바로 가기</small></div><span class="v"></span><span class="ch">›</span></div></div></body></html>

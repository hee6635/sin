<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>부가 기능 시안</title><style>:root{--bg:#fff;--fg:#1b2130;--sub:#4a5262;--tile:#f4f6f9;--ic:#2f4a8a;--ac:#5b7fe0}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 -apple-system,"Noto Sans KR",sans-serif}
.w{max-width:390px;margin:0 auto;padding:16px 16px 30px}h1{font-size:24px;margin:2px 0 12px}.bk{font-size:15px;color:var(--sub);margin-bottom:6px}
.sr{display:flex;align-items:center;gap:8px;background:var(--tile);border-radius:12px;padding:11px 12px;color:var(--sub);font-size:14px}
.hd{font-size:13px;font-weight:700;color:var(--sub);margin:16px 2px 8px}
.ts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.t{position:relative;background:var(--tile);border-radius:14px;padding:14px 6px 12px;display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;min-height:104px}
.ic{color:var(--ic);display:flex}.t b{font-size:14px;margin-top:4px;line-height:1.25}.t small{font-size:12px;color:var(--sub)}
.t.off{background:#fafbfc;border:1.5px dashed #d5d9e0}.t.off .ic{color:#9aa1ad}.t.off b{color:#6b7280}.t.off small{color:#8a919c}
.sw{position:absolute;top:8px;right:8px;width:34px;height:20px;border-radius:10px;background:#cfd4dc}.sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff}
.sw.on{background:var(--ac)}.sw.on::after{left:16px}.go{position:absolute;bottom:6px;right:9px;color:#9aa1ad;font-size:15px}
.ad .t{padding-top:22px}.nt{font-size:12.5px;color:var(--sub);margin:12px 2px 0;line-height:1.6}</style></head><body><div class="w"><div class="bk">‹ 설정</div><h1>부가 기능</h1><div class="ts ad"><div class="t "><span class="ic"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16.5" rx="2"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/><path d="M12 17.5s-3-1.8-3-3.6a1.5 1.5 0 0 1 3-.6 1.5 1.5 0 0 1 3 .6c0 1.8-3 3.6-3 3.6z"/></svg></span><b>휴무일 · 기념일</b><small>회사 휴무 · 생일</small><span class="sw on"></span></div><div class="t "><span class="ic"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></span><b>같이 쉬는 날</b><small>가족 탭에 표시</small><span class="sw on"></span></div><div class="t off"><span class="ic"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M3 13h18"/></svg></span><b>동료 근무</b><small>다른 조 근무표</small><span class="sw "></span></div><div class="t "><span class="ic"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg></span><b>근무 통계 · 수당</b><small>대근 · 연차 · 수당</small><span class="sw on"></span></div><div class="t "><span class="ic"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 3v2h6V3M9 10h6M9 14h6M9 18h3"/></svg></span><b>업무 메모</b><small>인수인계 · 나만 봄</small><span class="sw on"></span></div><div class="t "><span class="ic"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 18 0z"/><path d="M12 12v7a2 2 0 0 0 4 0"/></svg></span><b>출퇴근 날씨</b><small>알람 · 날짜 창</small><span class="sw on"></span></div></div><div class="nt">· 꺼진 칸(흐림): 칸 어디를 눌러도 켜져요<br>· 켜진 칸: 누르면 그 기능 설정으로 · 끌 때는 오른쪽 위 스위치</div></div></body></html>

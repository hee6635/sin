<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>설정 시안 2</title><style>:root{--bg:#fff;--fg:#1b2130;--sub:#4a5262;--tile:#f4f6f9;--ic:#2f4a8a;--ac:#5b7fe0}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 -apple-system,"Noto Sans KR",sans-serif}

.ts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

.sw.on{background:var(--ac)}.sw.on::after{left:16px}.go{position:absolute;bottom:6px;right:9px;color:#9aa1ad;font-size:15px}

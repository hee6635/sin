<!doctype html><html lang="ko"><head><meta charset="utf-8"><style>
@font-face{font-family:P;src:url(../../app/src/main/assets/fonts/PretendardVariable.woff2)}
*{box-sizing:border-box}
body{margin:0;background:#dfe2e6;font-family:P,sans-serif;color:#191f28;padding:16px;display:flex;gap:16px;width:max-content}
.col{display:flex;flex-direction:column;gap:8px}.col>b{font-size:15px;margin-left:4px}.col>b em{font-style:normal;color:#3182f6}
.ph{width:390px;height:844px;background:#fff;border-radius:28px;overflow:hidden;position:relative}
.top{padding:14px 18px 0;font-size:15px;color:#4e5968;font-weight:600}
.hd{display:flex;align-items:center;justify-content:space-between;padding:6px 18px 0}
.hd .t{text-align:center}.hd .t b{font-size:22px;font-weight:800}.hd .t small{display:flex;align-items:center;justify-content:center;gap:6px;font-size:13.5px;color:#8b95a1;margin-top:2px}
.hd .ar{font-size:24px;color:#191f28;width:30px;text-align:center}
.tag{background:#e8f3ff;color:#1b64da;font-weight:700;font-size:12px;border-radius:999px;padding:2px 8px}
.strip{display:flex;justify-content:space-between;padding:12px 10px;background:#f2f4f6;margin-top:12px}
.si{width:50px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12.5px;color:#8b95a1;font-weight:600;border-radius:14px;padding:4px 0}
.si.on{box-shadow:inset 0 0 0 2px #3f6f9f;color:#191f28}
.bd{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px}
.d{background:#a6c6e2;color:#1c2a31}.n{background:#e0b8a3;color:#2b1f1b}.r{color:#c23a5a;background:transparent}
.body{background:#f2f4f6;padding:2px 0 24px;height:100%}
.lbl{display:flex;align-items:center;justify-content:space-between;padding:16px 22px 8px;font-size:14px;color:#6b7684;font-weight:700}
.pill{display:flex;align-items:center;gap:8px;background:#fff;border-radius:999px;padding:5px 12px 5px 6px;font-weight:800;font-size:15px;color:#191f28;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.pill .bd{width:26px;height:26px;font-size:12.5px}.pill small{font-size:12px;color:#8b95a1;font-weight:700}
.card{background:#fff;border-radius:22px;margin:0 14px;padding:14px;box-shadow:0 2px 12px rgba(15,23,42,.035)}
.card+.card{margin-top:12px}
.chips{display:flex;gap:10px}
.ch{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12.5px;color:#8b95a1;font-weight:600}
.ch .bd{width:48px;height:48px;font-size:18px}
.ch.on .bd{box-shadow:0 0 0 3px #fff,0 0 0 5px #3182f6}.ch.on{color:#3182f6;font-weight:800}
.ask{margin-top:14px;font-size:14px;color:#4e5968;font-weight:600}.ask b{color:#191f28}
textarea{display:block;width:100%;border:0;background:#f2f4f6;border-radius:14px;padding:12px 14px;font:500 15px P;min-height:56px;margin-top:10px;resize:none;color:#191f28}
textarea::placeholder{color:#a3acb7}
.multi{display:flex;align-items:center;gap:10px;margin-top:10px;background:#e8f3ff;color:#1b64da;border-radius:14px;padding:13px 14px;font-weight:700;font-size:15px}
.multi svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.multi i{margin-left:auto;font-style:normal;opacity:.6}
.send{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:10px;height:50px;border-radius:14px;background:#3182f6;color:#fff;font-weight:800;font-size:16px}
.send small{font-weight:600;opacity:.8;font-size:13px}
.st{display:flex;align-items:center;gap:12px}
.st .ic{width:40px;height:40px;border-radius:12px;background:#fff3e0;color:#f08a00;display:grid;place-items:center}
.st .ic svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.st b{display:block;font-size:15.5px}.st span{font-size:13px;color:#8b95a1;font-weight:600}
.st .x{margin-left:auto;font-size:13.5px;font-weight:700;color:#8b95a1;background:#f2f4f6;border-radius:999px;padding:7px 12px}
.mh{display:flex;align-items:center;gap:6px;font-weight:800;font-size:15px;color:#7b5cf0}
.memo{display:flex;gap:8px;margin-top:10px}.memo input{flex:1;border:0;background:#f2f4f6;border-radius:14px;padding:0 14px;height:46px;font:500 15px P}
.memo .go{flex:none;width:46px;height:46px;border-radius:14px;background:#7b5cf0;display:grid;place-items:center;color:#fff}
.memo .go svg{width:20px;height:20px;fill:currentColor}
.mm{margin-top:10px;background:#f3f0ff;border-radius:12px;padding:10px 12px;font-size:14px;font-weight:600;color:#3b2a7a}
.mm small{display:block;font-size:12px;color:#8b7fc0;margin-top:2px}
.note{font-size:13.5px;color:#4e5968;line-height:1.6;max-width:300px}
</style></head><body>
<script>
const strip=(sel)=>[['14','n','야'],['15','n','야'],['16','r','휴'],['17','r','휴'],['18','d','주'],['19','d','주'],['20','r','휴']].map(([d,c,t])=>`<div class="si ${d===sel?'on':''}">${d}일<span class="bd ${c}">${t}</span></div>`).join('');
const head=(sub)=>`<div class="top">‹ 남편 달력</div><div class="hd"><span class="ar">‹</span><div class="t"><b>10월 17일 (토)</b><small>${sub}</small></div><span class="ar">›</span></div><div class="strip">${strip('17')}</div>`;
const memo=`<div class="lbl">가족 메모</div><div class="card"><div class="memo"><input placeholder="가족에게 남길 메모"><span class="go"><svg viewBox="0 0 24 24"><path d="M3 20l18-8L3 4v6l12 2-12 2z"/></svg></span></div></div>`;
const chips=on=>`<div class="chips">${[['d','주','주간'],['n','야','야간'],['r','휴','휴무']].map(([c,t,n])=>`<div class="ch ${t===on?'on':''}"><span class="bd ${c}">${t}</span>${n}</div>`).join('')}</div>`;
document.write(`
<div class="col"><b>지금</b><img src="now_rq.png" style="width:390px;border-radius:28px"></div>
<div class="col"><b>바꾼 뒤 · <em>기본</em></b><div class="ph">${head('남편 · 휴무')}<div class="body">
  <div class="lbl">근무<span class="pill"><span class="bd r">휴</span>휴무<small>· 요청하기 ▾</small></span></div>
  ${memo}
</div></div></div>
<div class="col"><b>바꾼 뒤 · <em>요청 펼침</em></b><div class="ph">${head('남편 · 휴무')}<div class="body">
  <div class="lbl">근무 바꿔 달라고 하기<span class="pill"><span class="bd r">휴</span>휴무<small>▴</small></span></div>
  <div class="card">${chips('주')}
    <div class="ask"><b>휴무 → 주간</b>으로 바꿔 달라고 할게요</div>
    <textarea placeholder="한마디 (예: 아이 학예회라 같이 가자)"></textarea>
    <div class="multi"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01"/></svg>여러 날 고르기<i>›</i></div>
    <div class="send">요청 보내기 <small>· 9건 남음</small></div>
  </div>
  ${memo}
</div></div></div>
<div class="col"><b>바꾼 뒤 · <em>요청 중</em></b><div class="ph">${head('남편 · 휴무 <span class="tag">요청 중</span>')}<div class="body">
  <div class="lbl">근무<span class="pill"><span class="bd r">휴</span>휴무<small>· 요청 중</small></span></div>
  <div class="card"><div class="st"><span class="ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span><div><b>주간으로 요청했어요</b><span>답 기다리는 중 · 오늘 오후 3:20</span></div><span class="x">취소</span></div></div>
  <div class="lbl">가족 메모</div><div class="card"><div class="mm">학예회 10시 시작이래<small>아내 · 오후 3:21</small></div><div class="memo"><input placeholder="가족에게 남길 메모"><span class="go"><svg viewBox="0 0 24 24"><path d="M3 20l18-8L3 4v6l12 2-12 2z"/></svg></span></div></div>
</div></div></div>
<div class="col" style="justify-content:center"><div class="note">· 내 날짜 창과 같은 짜임: 회색 바탕 · 흰 카드 · "근무" 줄 오른쪽 알약 · 날짜 띠 오늘/고른 날 테두리<br>· 요청: 근무 칩(파란 고리) → "휴무 → 주간" 한 줄로 확인 → 한마디 → 여러 날 고르기(연파랑 버튼, 칠하기와 같은 모양) → 요청 보내기(남은 건수 같이)<br>· 요청 중이면 카드 하나로 상태 · 취소<br>· 가족 메모 = 보라 카드 (내 메모 카드와 같은 모양)<br>· "보기만" · 📩 이모지 · 설명 글 빼기</div></div>
`);
</script></body></html>

<!doctype html><html lang="ko"><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:#e9ebef;padding:26px;width:1060px;color:#1d2330}
h1{font-size:20px;font-weight:900}.sub{font-size:13px;color:#6b7280;margin:4px 0 16px}
.row{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.card{background:#fff;border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px;align-items:center;box-shadow:0 4px 12px rgba(0,0,0,.07)}
.card b{font-size:15px}.card small{font-size:11.5px;color:#6b7280;text-align:center;min-height:30px}
.cells{display:flex;gap:4px}
.c{width:56px;height:66px;border:1px solid #eceef1;border-radius:6px;background:#fff;padding:3px}
.c.dk{background:#1d2027;border-color:#2c3038;color:#e8eaee}
.dn{display:flex;align-items:center;gap:2px;font-size:11px;font-weight:600}
.k{margin:6px auto 0;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:11px;background:#c9d6dd;color:#33505e}
.dk .k{background:#3b4a55;color:#d3e2ea}
.e{font-size:12px;line-height:1}
.bdg{width:14px;height:14px;border-radius:50%;display:grid;place-items:center;font-size:9px;line-height:1}
.big{font-size:34px}
.pk{font-weight:900;font-size:13px;color:#7b5cf0}
</style></head><body>
<h1>🏃 조깅 도장 — 작은 칸에서 잘 보이는 후보</h1><div class="sub">위: 크게 / 아래: 달력 칸 실제 크기 (라이트 · 다크)</div>
<div class="row" id="r"></div>
<script>
const V=[
 ['지금','🏃','<span class="e">🏃</span>','사람 모양이 가늘어서 작으면 안 보임'],
 ['A. 운동화','👟','<span class="e">👟</span>','덩어리가 커서 작아도 잘 보임 · 조깅/걷기'],
 ['B. 메달','🏅','<span class="e">🏅</span>','색이 진해서 눈에 띔 · "해냈다" 느낌'],
 ['C. 불꽃','🔥','<span class="e">🔥</span>','강렬함 · 운동 · 다이어트'],
 ['D. 색 동그라미 + 이모티콘','🏃','<span class="bdg" style="background:#16a34a">🏃</span>','초록 바탕 동그라미에 넣어서 또렷하게 (모든 도장에 적용 가능)'],
 ['E. 색 동그라미 + 글자','런','<span class="bdg" style="background:#16a34a;color:#fff;font-weight:900;font-size:8.5px">런</span>','이모티콘 대신 한 글자 · 가장 또렷함']];
document.getElementById('r').innerHTML=V.map(([n,big,sm,d],i)=>`<div class="card"><b>${n}</b>
 <div class="big">${i>=4?sm.replace('14px','40px').replace('14px','40px').replace('font-size:9px','font-size:24px').replace('font-size:8.5px','font-size:22px').replace(/width:14px;height:14px/,''):big}</div>
 <small>${d}</small>
 <div class="cells"><div class="c"><div class="dn">12 ${sm}</div><span class="k">주</span></div><div class="c dk"><div class="dn">13 ${sm}</div><span class="k">주</span></div></div></div>`).join('');
document.querySelectorAll('.card .big .bdg').forEach(x=>{x.style.width='44px';x.style.height='44px';});
</script></body></html>

<!doctype html><html lang="ko"><head><meta charset="utf-8"><style>
@font-face{font-family:P;src:url(../../app/src/main/assets/fonts/PretendardVariable.woff2)}
*{box-sizing:border-box;margin:0}
body{font-family:P,sans-serif;background:#fff;width:390px;height:420px;overflow:hidden;position:relative;color:#191f28}
.top{height:60px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800}
.mock i{display:block;height:58px;border-radius:12px;background:#eef3f9;margin:8px 10px}.mock i:nth-child(2n){background:#f8ece6}
.stack{position:absolute;left:0;right:0;top:66px;height:0;perspective:600px;display:flex;justify-content:center}
.t{position:absolute;top:0;display:flex;align-items:center;gap:8px;height:44px;padding:0 20px;border-radius:22px;background:#25282e;color:#fff;font-size:14.5px;font-weight:600;white-space:nowrap;box-shadow:0 8px 22px rgba(0,0,0,.18);transform-origin:50% 0}
.t em{font-style:normal;color:#9fd3ff;font-weight:700;margin-left:4px}
.tap{position:absolute;width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.16);pointer-events:none;opacity:0;transform:translate(-50%,-50%) scale(.5);transition:opacity .15s,transform .2s;z-index:9}.tap.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
</style></head><body>
<div class="top">2026.11</div>
<div class="mock"><i></i><i></i><i></i><i></i><i></i></div>
<div class="stack" id="st"></div>
<script>
const st=document.getElementById('st');const EO='cubic-bezier(.2,.9,.25,1)';let live=[];
function show(html){
  // 이미 떠 있는 알림은 뒤로 살짝 밀려 내려가며 덮임
  live.forEach((o,i)=>{const d=live.length-i;o.style.zIndex=10-d;o.animate([{transform:o._tf||'none',opacity:o._op||1},{transform:`translateY(${8*d}px) scale(${1-.06*d})`,opacity:d>1?0:.55}],{duration:320,easing:EO,fill:'forwards'});o._tf=`translateY(${8*d}px) scale(${1-.06*d})`;o._op=d>1?0:.55;});
  const t=document.createElement('div');t.className='t';t.innerHTML=html;t.style.zIndex=10;st.appendChild(t);live.push(t);
  t.animate([{transform:'rotateX(-92deg)',opacity:0},{transform:'rotateX(14deg)',opacity:1,offset:.6},{transform:'rotateX(-5deg)',offset:.82},{transform:'none',opacity:1}],{duration:560,easing:'ease-out'});
  clearTimeout(show._t);show._t=setTimeout(hideAll,2400);}
function hideAll(){const all=live;live=[];all.forEach((o,i)=>{const a=o.animate([{transform:o._tf||'none',opacity:o._op||1},{transform:'rotateX(-90deg)',opacity:0}],{duration:300,delay:(all.length-1-i)*40,easing:'ease-in',fill:'forwards'});a.onfinish=()=>o.remove();});}
if(location.hash==='#auto'){
  setTimeout(()=>show('메모를 저장했어요'),500);
  setTimeout(()=>show('스티커를 붙였어요'),1500);
  setTimeout(()=>show('메모를 지웠어요<em>되돌리기</em>'),2400);
  setTimeout(()=>show('가족에게 보냈어요'),6200);
}
</script></body></html>

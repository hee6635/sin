</style></head><body><h2>요청이 있는 날 · 모양으로 구분하기 (이모티콘 없이)</h2><p>27일 · 31일 = 답할 요청, 14일 = 보류. 색은 같고 모양만 다르게 해 본 4가지예요.</p>
<div class="r">
<div class="c"><b>A · 접힌 모서리</b><small>칸 오른쪽 위가 종이처럼 접힌 모양<br>보류는 연한 모서리</small><img src="family23/markA.png"></div>
<div class="c"><b>B · 점선 칸</b><small>칸 둘레에 점선 테두리<br>오늘(초록 실선)과 모양이 달라요</small><img src="family23/markB.png"></div>
<div class="c"><b>C · 동그라미 바깥 링</b><small>주/야 동그라미 둘레에 링이 한 겹 더<br>달력에서 근무 모양이 바뀐 느낌</small><img src="family23/markC.png"></div>
<div class="c"><b>D · 네모 도장 + 아래 바</b><small>날짜 숫자가 네모 도장, 칸 아래 굵은 바<br>보류는 점선 바</small><img src="family23/markD.png"></div>
</div></body></html>

<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#c9cfc4;font-family:system-ui,'Noto Sans CJK KR',sans-serif;padding:20px;display:flex;flex-direction:column;gap:18px}
.w{width:420px;background:#fff;border-radius:24px;padding:10px 12px;box-shadow:0 4px 16px #0002}

.mid{position:absolute;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:14px}
.ar{width:30px;height:30px;border-radius:50%;background:#e6e8ec;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;color:#444}

.op svg{width:16px;height:16px;stroke:#444;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.row{display:flex;gap:4px;margin-top:6px}.row div{flex:1;height:38px;border-radius:8px;background:#f2f3f5}
</style></head><body>

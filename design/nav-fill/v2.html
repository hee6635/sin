<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<style>
@font-face{font-family:P;src:url(../../app/src/main/assets/fonts/PretendardVariable.woff2)}
*{box-sizing:border-box;margin:0}
:root{--accent:#3182f6;--fg:#191f28;--navfg:#9aa1ad}
body{font-family:P,sans-serif;background:#f2f4f6;width:390px;height:300px;overflow:hidden;position:relative}
.mock{position:absolute;inset:16px 14px 90px;border-radius:22px;background:#fff;box-shadow:0 2px 12px rgba(15,23,42,.04)}
.mock i{display:block;height:12px;border-radius:6px;background:#eef0f3;margin:18px 18px 0}.mock i:nth-child(2){width:60%}.mock i:nth-child(3){width:75%}
nav{position:absolute;left:0;right:0;bottom:0;display:flex;background:#fff;border-top:1px solid #eef0f3;padding-bottom:8px}
nav button{flex:1;border:0;background:none;padding:10px 0 8px;display:flex;flex-direction:column;align-items:center;gap:4px;font:600 12.5px P;color:var(--navfg);transition:color .25s}
nav button.on{color:var(--fg);font-weight:800}
.ic{position:relative;width:26px;height:26px}
.ic svg{position:absolute;inset:1px;width:24px;height:24px;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;fill:none}
.ic .fl{fill:#e3e6ea;stroke:var(--fg);clip-path:inset(100% 0 0 0)}
.ic .sh{position:absolute;left:5px;right:5px;bottom:-4px;height:4px;border-radius:50%;background:rgba(15,23,42,.18);filter:blur(1.5px);transform:scaleX(0);opacity:0}
nav button.on .ic .fl{clip-path:inset(0 0 0 0)}
nav button.on .ic{transform:translateY(-3px)}
nav button.on .ic .sh{transform:scaleX(1);opacity:1}
.tap{position:absolute;width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,.12);pointer-events:none;opacity:0;transform:translate(-50%,-50%) scale(.5);transition:opacity .15s,transform .2s}
.tap.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
</style></head><body>
<div class="mock"><i></i><i></i><i></i><i></i></div>
<nav id="nav">
 <button class="on"><span class="ic"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg></span>달력</button>
 <button><span class="ic"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20v-1a5 5 0 0 1 5-5h3a5 5 0 0 1 5 5v1"/><circle cx="17.5" cy="9.5" r="2.5"/><path d="M17 14.2a4 4 0 0 1 4.5 4V20"/></svg></span>가족</button>
 <button><span class="ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="7.5"/><path d="M12 9v4.5l3 1.5M4 5.5l3-2.5M20 5.5l-3-2.5"/></svg></span>알람</button>
 <button><span class="ic"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></span>설정</button>
</nav>
<div class="tap" id="tap"></div>
<script>
// 아이콘 위에 같은 모양을 색 채운 판으로 한 장 더 겹쳐 두고, 고르면 아래에서 위로 차오름 + 아이콘이 살짝 떠오름(그림자)
document.querySelectorAll('.ic').forEach(ic=>{const s=ic.querySelector('svg'),f=s.cloneNode(true);f.classList.add('fl');ic.appendChild(f);const sh=document.createElement('i');sh.className='sh';ic.appendChild(sh);});
const EO='cubic-bezier(.3,.7,.4,1)';
function pick(b){const old=document.querySelector('nav button.on');if(old===b)return;
  old.classList.remove('on');b.classList.add('on');
  const oi=old.querySelector('.ic'),ni=b.querySelector('.ic');
  oi.animate([{transform:'translateY(-3px)'},{transform:'translateY(1px)',offset:.6},{transform:'none'}],{duration:320,easing:EO});
  oi.querySelector('.fl').animate([{clipPath:'inset(0 0 0 0)'},{clipPath:'inset(0 0 100% 0)'}],{duration:220,easing:'ease-in'});
  oi.querySelector('.sh').animate([{transform:'scaleX(1)',opacity:1},{transform:'scaleX(0)',opacity:0}],{duration:200});
  ni.animate([{transform:'none'},{transform:'translateY(1.5px) scale(.9)',offset:.25},{transform:'translateY(-5px) scale(1.06)',offset:.65},{transform:'translateY(-3px)'}],{duration:520,easing:EO});
  ni.querySelector('.fl').animate([{clipPath:'inset(100% 0 0 0)'},{clipPath:'inset(100% 0 0 0)',offset:.2},{clipPath:'inset(0 0 0 0)'}],{duration:520,easing:'cubic-bezier(.4,0,.2,1)'});
  ni.querySelector('.sh').animate([{transform:'scaleX(0)',opacity:0},{transform:'scaleX(0)',opacity:0,offset:.3},{transform:'scaleX(1.15)',opacity:1,offset:.7},{transform:'scaleX(1)',opacity:1}],{duration:520,easing:EO});}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>pick(b));
function tap(b){const r=b.querySelector('.ic').getBoundingClientRect(),t=document.getElementById('tap');t.style.left=(r.left+r.width/2)+'px';t.style.top=(r.top+r.height/2)+'px';t.classList.add('on');setTimeout(()=>t.classList.remove('on'),220);pick(b);}
if(location.hash==='#auto'){const bs=[...document.querySelectorAll('nav button')];[1,2,3,0,3,1,0].forEach((n,i)=>setTimeout(()=>tap(bs[n]),500+i*900));}
</script></body></html>

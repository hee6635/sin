<!doctype html><html lang="ko"><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0}
body{font-family:"Noto Sans CJK KR","Noto Sans KR",sans-serif;background:#eceef2;padding:26px;width:1500px;color:#1d2330}
h1{font-size:20px;font-weight:900;margin-bottom:4px}p.s{font-size:13px;color:#6b7280;margin-bottom:18px}
.g,.home{display:grid;grid-template-columns:repeat(8,1fr);gap:14px}
.c{display:flex;flex-direction:column;align-items:center;gap:8px}
.c b{font-size:14px}.c small{font-size:11.5px;color:#6b7280;text-align:center;line-height:1.4;min-height:32px}
svg.big{width:150px;height:150px;border-radius:34px;box-shadow:0 8px 20px rgba(0,0,0,.18)}
.home{margin-top:22px;border-radius:26px;padding:22px 26px;background:linear-gradient(160deg,#6d7b88,#a3a9ad 50%,#7d8a84)}
.h{display:flex;flex-direction:column;align-items:center;gap:6px;color:#fff;font-size:12px;text-shadow:0 1px 3px rgba(0,0,0,.5)}
svg.sm{width:62px;height:62px;border-radius:15px}
</style></head><body>
<h1>E 아이콘 — 달력 안 모양 바꾸기</h1><p class="s">바탕(남색)과 얇은 달력 틀은 그대로 · 안쪽만 다르게 · 아래는 폰 홈 화면 크기</p>
<div class="g" id="g"></div><div class="home" id="h"></div>
<script>
const FONT='font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif"';
const Y='#FFD36B',W='#fff',CO='#FF5C7A';
const star=(x,y,r=4,c=Y)=>`<path d="M${x},${y-r}L${x+r*.3},${y-r*.3}L${x+r},${y}L${x+r*.3},${y+r*.3}L${x},${y+r}L${x-r*.3},${y+r*.3}L${x-r},${y}L${x-r*.3},${y-r*.3}z" fill="${c}"/>`;
const moon=(id,cx,cy,r,c=W)=>`<mask id="${id}"><rect width="108" height="108" fill="#fff"/><circle cx="${cx+r*.5}" cy="${cy-r*.35}" r="${r*.85}" fill="#000"/></mask><circle cx="${cx}" cy="${cy}" r="${r}" fill="${c}" mask="url(#${id})"/>`;
const frame=(id,inner)=>`<defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#252A66"/><stop offset="1" stop-color="#3B3F9E"/></linearGradient></defs><rect width="108" height="108" fill="url(#${id})"/><rect x="25" y="28" width="58" height="56" rx="13" fill="none" stroke="#fff" stroke-width="4"/><path d="M25,46h58" stroke="#fff" stroke-width="4"/><rect x="38" y="22" width="5" height="13" rx="2.5" fill="#fff"/><rect x="65" y="22" width="5" height="13" rx="2.5" fill="#fff"/>${inner}`;
const I=[
{n:'지금 E',s:'노란 점 하나',v:id=>frame(id,`<circle cx="67" cy="66" r="9" fill="${Y}"/><circle cx="41" cy="66" r="3.3" fill="#fff" opacity=".55"/><circle cx="54" cy="66" r="3.3" fill="#fff" opacity=".55"/>`)},
{n:'E1 · 해 + 달',s:'낮 · 밤 교대<br>해와 달이 나란히',v:id=>frame(id,`<circle cx="41" cy="66" r="9" fill="${Y}"/>${moon(id+'m',68,66,10)}`)},
{n:'E2 · 달과 별',s:'쉬는 밤 · 잠<br>초승달에 별 하나',v:id=>frame(id,`${moon(id+'m',50,66,12)}${star(68,60,5)}${star(72,73,2.6,'#fff')}`)},
{n:'E3 · 노란 "쉬"',s:'달력 안에<br>노란 글자 하나',v:id=>frame(id,`<text x="54" y="75.5" text-anchor="middle" font-size="22" font-weight="900" fill="${Y}" ${FONT}>쉬</text>`)},
{n:'E4 · 하트',s:'같이 쉬는 날<br>(가족)',v:id=>frame(id,`<path d="M54,78c-9,-6.5 -12.5,-10.5 -12.5,-15a6.7,6.7 0 0 1 12.5,-3a6.7,6.7 0 0 1 12.5,3c0,4.5 -3.5,8.5 -12.5,15z" fill="#FF6B8E"/>`)},
{n:'E5 · 체크',s:'쉬는 날 확인<br>노란 동그라미에 ✓',v:id=>frame(id,`<circle cx="54" cy="66" r="12" fill="${Y}"/><path d="M48,66l4.5,4.5l8,-9" fill="none" stroke="#252A66" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round"/>`)},
{n:'E6 · "휴" 동그라미',s:'앱 달력의 빨간 "휴"<br>그대로',v:id=>frame(id,`<circle cx="54" cy="66" r="12.5" fill="${CO}"/><text x="54" y="71.5" text-anchor="middle" font-size="15" font-weight="800" fill="#fff" ${FONT}>휴</text>`)},
{n:'E7 · zZ',s:'낮잠 · 쉬는 중<br>노란 z 글자',v:id=>frame(id,`<text x="46" y="78" text-anchor="middle" font-size="26" font-weight="900" fill="${Y}" ${FONT}>Z</text><text x="64" y="68" text-anchor="middle" font-size="17" font-weight="900" fill="${Y}" opacity=".85" ${FONT}>z</text><text x="73" y="60" text-anchor="middle" font-size="11" font-weight="900" fill="${Y}" opacity=".65" ${FONT}>z</text>`)}
];
g.innerHTML=I.map((x,i)=>`<div class="c"><svg class="big" viewBox="0 0 108 108">${x.v('e'+i)}</svg><b>${x.n}</b><small>${x.s}</small></div>`).join('');
h.innerHTML=I.map((x,i)=>`<div class="h"><svg class="sm" viewBox="0 0 108 108">${x.v('h'+i)}</svg>언제쉬어</div>`).join('');
</script></body></html>

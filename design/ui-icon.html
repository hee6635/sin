<!doctype html><html lang="ko"><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0}
body{font-family:"Noto Sans CJK KR","Noto Sans KR",sans-serif;background:#eceef2;padding:26px;width:1320px;color:#1d2330}
h1{font-size:20px;font-weight:900;margin-bottom:4px}p.s{font-size:13px;color:#6b7280;margin-bottom:18px}
.g{display:grid;grid-template-columns:repeat(7,1fr);gap:18px}
.c{display:flex;flex-direction:column;align-items:center;gap:8px}
.c b{font-size:14px}.c small{font-size:11.5px;color:#6b7280;text-align:center;line-height:1.4;min-height:32px}
svg.big{width:150px;height:150px;border-radius:34px;box-shadow:0 8px 20px rgba(0,0,0,.18)}
.home{margin-top:22px;border-radius:26px;padding:22px 26px;background:linear-gradient(160deg,#6d7b88,#a3a9ad 50%,#7d8a84);display:grid;grid-template-columns:repeat(7,1fr);gap:18px}
.h{display:flex;flex-direction:column;align-items:center;gap:6px;color:#fff;font-size:12px;text-shadow:0 1px 3px rgba(0,0,0,.5)}
svg.sm{width:62px;height:62px;border-radius:15px}
.tag{font-size:11px;font-weight:800;color:#fff;background:#7b5cf0;border-radius:9px;padding:1px 7px}
</style></head><body>
<h1>앱 아이콘 시안</h1><p class="s">큰 그림 위 · 폰 홈 화면에서 보이는 크기 아래 (왼쪽이 지금 아이콘)</p>
<div class="g" id="g"></div>
<div class="home" id="h"></div>
<script>
const FONT='font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif"';
const defs=(id,a,b)=>`<defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient></defs>`;
const rings=(y,c='#fff')=>`<rect x="38" y="${y-6}" width="5" height="13" rx="2.5" fill="${c}"/><rect x="65" y="${y-6}" width="5" height="13" rx="2.5" fill="${c}"/>`;
const I=[
{n:'지금',s:'보라 바탕 · 달력 · "쉬"',v:`${defs('a0','#8A6CF6','#4F7CFF')}<rect width="108" height="108" fill="url(#a0)"/><rect x="26" y="30" width="56" height="56" rx="14" fill="#fff"/><path d="M26,44a14,14 0 0 1 14,-14h28a14,14 0 0 1 14,14z" fill="#FF5C7A"/>${rings(30)}<text x="54" y="77" text-anchor="middle" font-size="32" font-weight="800" fill="#2B2F6B" ${FONT}>쉬</text>`},
{n:'A · 쉬는 날 하루',s:'달력에 빨간 "휴" 동그라미 하나<br>(앱 달력과 똑같은 모양)',v:`${defs('a1','#7A5CF0','#4F7CFF')}<rect width="108" height="108" fill="url(#a1)"/><rect x="21" y="25" width="66" height="62" rx="15" fill="#fff"/><path d="M21,40a15,15 0 0 1 15,-15h36a15,15 0 0 1 15,15z" fill="#FF5C7A"/>${rings(25)}${[0,1,2].map(r=>[0,1,2].map(c=>(r===1&&c===2)?'':`<circle cx="${37+c*17}" cy="${55+r*15}" r="4.2" fill="#D7D9F2"/>`).join('')).join('')}<circle cx="71" cy="70" r="11.5" fill="#FF5C7A"/><text x="71" y="75" text-anchor="middle" font-size="14" font-weight="800" fill="#fff" ${FONT}>휴</text>`},
{n:'B · 해와 달',s:'주간 · 야간 교대<br>밤하늘 바탕에 해와 달',v:`${defs('a2','#2A2F73','#5B4BD6')}<rect width="108" height="108" fill="url(#a2)"/><circle cx="64" cy="44" r="19" fill="#FFD36B"/><path d="M52,50a24,24 0 1 0 22,36a19,19 0 0 1 -22,-36z" fill="#F4F1FF"/><circle cx="82" cy="78" r="2.6" fill="#fff"/><circle cx="30" cy="30" r="2.2" fill="#fff" opacity=".9"/><circle cx="86" cy="26" r="1.8" fill="#fff" opacity=".8"/>`},
{n:'C · 글자 하나',s:'큰 흰 글자 "쉬"만<br>가장 단순 · 눈에 잘 띔',v:`${defs('a3','#8A6CF6','#4F7CFF')}<rect width="108" height="108" fill="url(#a3)"/><text x="54" y="76" text-anchor="middle" font-size="62" font-weight="900" fill="#fff" ${FONT}>쉬</text><circle cx="82" cy="30" r="6.5" fill="#FF5C7A"/>`},
{n:'D · 가족 하트',s:'달력 한 칸에 하트<br>"같이 쉬는 날"',v:`${defs('a4','#FF8FA8','#8A6CF6')}<rect width="108" height="108" fill="url(#a4)"/><rect x="21" y="25" width="66" height="62" rx="15" fill="#fff"/><path d="M21,40a15,15 0 0 1 15,-15h36a15,15 0 0 1 15,15z" fill="#7A5CF0"/>${rings(25)}${[0,1,2].map(r=>[0,1,2].map(c=>(r===1&&c===1)?'':`<circle cx="${37+c*17}" cy="${55+r*15}" r="4.2" fill="#E3DDF8"/>`).join('')).join('')}<path d="M54,78c-9,-6.5 -12.5,-10.5 -12.5,-15a6.7,6.7 0 0 1 12.5,-3a6.7,6.7 0 0 1 12.5,3c0,4.5 -3.5,8.5 -12.5,15z" fill="#FF4D79"/>`},
{n:'E · 어두운 단순',s:'남색 바탕에 얇은 달력,<br>노란 점 하나(쉬는 날)',v:`${defs('a5','#252A66','#3B3F9E')}<rect width="108" height="108" fill="url(#a5)"/><rect x="25" y="28" width="58" height="56" rx="13" fill="none" stroke="#fff" stroke-width="4"/><path d="M25,46h58" stroke="#fff" stroke-width="4"/>${rings(28)}<circle cx="67" cy="66" r="9" fill="#FFD36B"/><circle cx="41" cy="66" r="3.3" fill="#fff" opacity=".55"/><circle cx="54" cy="66" r="3.3" fill="#fff" opacity=".55"/>`},
{n:'F · 의자 쉼',s:'커피잔 김이 나는<br>쉬는 시간 느낌',v:`${defs('a6','#FFB36B','#FF6F8E')}<rect width="108" height="108" fill="url(#a6)"/><path d="M30,48h40v14a20,20 0 0 1 -40,0z" fill="#fff"/><path d="M70,52h6a8,8 0 0 1 0,16h-7" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/><rect x="26" y="82" width="48" height="5" rx="2.5" fill="#fff" opacity=".85"/><path d="M42,40c-4,-5 4,-8 0,-14M54,40c-4,-5 4,-8 0,-14M66,40c-4,-5 4,-8 0,-14" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round" opacity=".9"/>`}
];
document.getElementById('g').innerHTML=I.map((x,i)=>`<div class="c"><svg class="big" viewBox="0 0 108 108">${x.v}</svg><b>${x.n}</b><small>${x.s}</small></div>`).join('');
document.getElementById('h').innerHTML=I.map(x=>`<div class="h"><svg class="sm" viewBox="0 0 108 108">${x.v}</svg>언제쉬어</div>`).join('');
</script></body></html>

<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:J;src:url(../../app/src/main/assets/fonts/jua.ttf)}
body{margin:0;background:#f4f5f8;font-family:system-ui,'Noto Sans CJK KR',sans-serif;display:flex;gap:28px;padding:28px;color:#25233a}
.col{width:300px}.cap{font-size:13.5px;font-weight:800;color:#555;margin-bottom:8px}.h{font-size:19px;font-weight:800;margin:0 0 10px}
.card{border-radius:26px;padding:16px;background:linear-gradient(135deg,#e6e2fa,#dfe8f8)}
.me{display:inline-flex;width:40px;height:40px;border-radius:50%;background:#1d2330;color:#fff;font-weight:800;align-items:center;justify-content:center}
.top{display:flex;align-items:center;gap:10px}.top .bar{flex:1;margin-top:5px}.st{display:flex;align-items:center;gap:6px;margin-top:0;font-size:14px;font-weight:800;color:#3a3756}.st small{font-weight:700;color:#77738f}
.bar{height:6px;border-radius:4px;background:#cfd3e6;margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;width:62%;background:#f4c45a}
.wx{margin-top:12px;background:rgba(255,255,255,.65);border-radius:18px;padding:10px 12px}
.wx .k{display:flex;align-items:center;gap:8px}.wx .k img{width:44px}.wx .k b{font-family:J;font-weight:400;font-size:18px}.wx .k small{display:block;font-size:12px;font-weight:700;color:#5c5874}
.wx .r{display:flex;align-items:center;gap:4px;margin-top:6px;font-size:12px;font-weight:800;color:#5c5874}.wx .r img{width:30px}.wx .r em{font-style:normal;font-family:J;font-size:19px;color:#25233a}.wx .r .f{margin-left:auto;width:32px}
.big{font-size:24px;font-weight:800;margin-top:12px}.big small{display:block;font-size:14px;color:#6d6987;font-weight:700;margin-top:4px}
.bar2{height:8px;border-radius:5px;background:#cfd3e6;margin-top:10px;overflow:hidden}.bar2 i{display:block;height:100%;width:62%;background:#f4c45a}
</style></head><body>
<div class="col"><div class="cap">① 날씨를 켠 사람: 상태는 작게 · 날씨를 크게</div><div class="h">지금</div><div class="card">
<div class="top"><span class="me">나</span><div style="flex:1"><div class="st">💼 근무 중 <small>· 주간 19:00 끝</small></div><div class="bar"><i></i></div></div></div>
<div class="wx"><div class="k"><img src="../weather/clean2/wear/umbrella.png"><div><b>퇴근길에 비 와요</b><small>우산 챙기세요 · 오후 5시부터</small></div></div>
<div class="r">출근<img src="../weather/clean2/sky/cloudy.png"><em>6°</em> → 퇴근<img src="../weather/clean2/sky/rain.png"><em>12°</em><img class="f" src="../weather/clean2/faces/3.png"></div></div>
</div></div>
<div class="col"><div class="cap">② 날씨를 안 켠 사람: 상태를 크게</div><div class="h">지금</div><div class="card">
<div class="top"><span class="me">나</span><div class="big" style="margin-top:0">💼 근무 중</div></div>
<div class="big" style="margin-top:6px"><small>주간 · 19:00 끝 · 퇴근까지 4시간 20분</small></div><div class="bar2"><i></i></div>
</div></div>
<div class="col"><div class="cap">③ 쉬는 날 (날씨 켠 사람)</div><div class="h">지금</div><div class="card">
<div class="top"><span class="me">나</span><div class="st">🏖 휴무 <small>· 내일 주간 07:00 시작</small></div></div>
<div class="wx"><div class="k"><img src="../weather/clean2/sky/sun.png"><div><b>맑은 날이에요</b><small>트렌치코트 입으세요</small></div></div>
<div class="r">오전<img src="../weather/clean2/sky/sun.png"><em>9°</em> → 오후<img src="../weather/clean2/sky/partly.png"><em>16°</em><img class="f" src="../weather/clean2/faces/1.png"></div></div>
</div></div>
</body></html>

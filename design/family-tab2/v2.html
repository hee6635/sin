<!doctype html><html lang="ko"><head><meta charset="utf-8"><style>@font-face{font-family:P;src:url(../../app/src/main/assets/fonts/PretendardVariable.woff2)}
*{box-sizing:border-box}body{margin:0;font-family:P;background:#dfe2e6;padding:16px;width:460px;color:#191f28}
.ph{width:420px;background:#f2f4f6;border-radius:26px;padding:0 0 20px;overflow:hidden}
.top{display:flex;align-items:center;gap:8px;padding:18px 16px 4px 20px}.top b{flex:1;font-size:26px;font-weight:800}.hb{width:38px;height:38px;border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:center;color:#4e5968}.hb svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.cap{font-size:13px;font-weight:700;color:#6b7684;padding:16px 22px 8px;display:flex;justify-content:space-between;align-items:center}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 14px}
.cd{background:#fff;border-radius:22px;padding:14px;box-shadow:0 2px 12px rgba(15,23,42,.04)}
.who{display:flex;align-items:center;gap:8px}.av{width:34px;height:34px;border-radius:50%;background:#191f28;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex:none}.av.ph2{background:#d9cfc2}
.who small{display:block;font-size:12px;color:#8b95a1;font-weight:600}.who b{font-size:17px;font-weight:800}
.sub{font-size:13px;color:#6b7684;margin:10px 0 6px}.bar{height:5px;border-radius:3px;background:#eef0f2}.bar i{display:block;height:100%;width:85%;border-radius:3px;background:#f6c23e}
.wx{display:flex;justify-content:space-around;background:#f7f8fa;border-radius:14px;margin-top:10px;padding:8px 2px}.w{text-align:center}.w small{display:block;font-size:11.5px;color:#8b95a1}.w .cl{font-size:18px;color:#9aa4b0}.w b{display:block;font-size:14px}
.alert{font-size:13px;color:#3182f6;font-weight:700;margin-top:8px}
.tbc{margin:0 14px;background:#fff;border-radius:22px;padding:12px 10px 10px;box-shadow:0 2px 12px rgba(15,23,42,.04)}
.tbh{display:flex;align-items:center;justify-content:space-between;padding:0 4px 10px}.tbh b{font-size:15px}.seg{display:flex;gap:6px}.seg span{height:32px;line-height:32px;padding:0 12px;border-radius:16px;background:#f2f4f6;font-size:13px;font-weight:600;color:#6b7684}.seg .on{background:#fff;color:#3182f6;box-shadow:0 0 0 1.5px #3182f6}
.grid{display:grid;grid-template-columns:46px repeat(7,1fr)}.names{display:flex;flex-direction:column;padding-top:46px;gap:0}.names div{height:52px;display:flex;align-items:center}
.col{display:flex;flex-direction:column;align-items:center;border-radius:14px;padding-top:4px}.col small{font-size:11.5px;font-weight:600}.col b{font-size:15px;margin-bottom:6px}
.col.all{background:#fff3d1}.col.td{box-shadow:inset 0 0 0 2px #3182f6}
.c,.r{height:52px;display:flex;align-items:center;justify-content:center}.c{width:34px;height:34px;border-radius:50%;margin:9px 0;font-size:13px;font-weight:700}.r{color:#e5484d;font-size:13px;font-weight:700}
.lg{display:flex;justify-content:center;gap:14px;font-size:12px;color:#6b7684;margin-top:8px}.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.addb{font-size:13px;font-weight:700;color:#3182f6;background:#fff;border-radius:16px;padding:6px 12px}
.chips{display:flex;gap:8px;padding:0 14px;flex-wrap:wrap}.chips span{background:#fff;border-radius:16px;padding:10px 14px;font-weight:800;font-size:15px;box-shadow:0 2px 12px rgba(15,23,42,.04)}.chips span small{font-weight:600;color:#a06a00;font-size:12.5px;margin-left:4px}
.chips span i{display:inline-block;width:8px;height:8px;border-radius:50%;background:#f6c23e;margin-right:6px;vertical-align:1px}
</style></head><body><div class="ph">

<div class="grid"><div class="names"><div><span class="av" style="width:28px;height:28px;font-size:11px">나</span></div><div><span class="av ph2" style="width:28px;height:28px;font-size:11px">유</span></div></div><div class="col all"><small style="color:#191f28">금</small><b>13</b><span class="r">휴</span><span class="r">휴</span></div><div class="col all"><small style="color:#3182f6">토</small><b>14</b><span class="r">휴</span><span class="r">휴</span></div><div class="col"><small style="color:#e5484d">일</small><b>15</b><span class="c" style="background:#a9c8e8;color:#1f3f63">주</span><span class="r">휴</span></div><div class="col td"><small style="color:#191f28">월</small><b>16</b><span class="c" style="background:#a9c8e8;color:#1f3f63">주</span><span class="c" style="background:#a9c8e8;color:#1f3f63">유</span></div><div class="col"><small style="color:#191f28">화</small><b>17</b><span class="c" style="background:#f6c23e;color:#5a3d00">교</span><span class="c" style="background:#a9c8e8;color:#1f3f63">유</span></div><div class="col"><small style="color:#191f28">수</small><b>18</b><span class="r">휴</span><span class="c" style="background:#a9c8e8;color:#1f3f63">유</span></div><div class="col"><small style="color:#191f28">목</small><b>19</b><span class="r">휴</span><span class="c" style="background:#a9c8e8;color:#1f3f63">유</span></div></div>
<div class="lg"><span><i style="background:#f6c23e"></i>다 같이 쉼</span><span><i style="background:#fff3d1"></i>낮엔 같이 (야간 전)</span></div></div>

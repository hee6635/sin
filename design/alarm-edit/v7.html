.ti{width:32px;height:32px;border-radius:10px;background:var(--fill);color:var(--ink2);display:flex;align-items:center;justify-content:center;flex:none}
.l{flex:1;min-width:0}.n{font-size:15.5px;font-weight:600}.d{font-size:13px;color:var(--ink3);margin-top:2px}
.v{display:flex;align-items:center;gap:2px;font-size:14.5px;font-weight:500;color:var(--ink2);flex:none}.v svg{color:#b0b8c1}
.tg{width:50px;height:30px;border-radius:15px;background:#e5e8eb;position:relative;flex:none}.tg::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.15)}.tg.on{background:var(--acc)}.tg.on::after{left:23px}
.sd{padding:0 16px 16px 60px;position:relative}
.mini{display:flex;gap:6px}.mp{padding:6px 11px;border-radius:9px;background:var(--fill);font-size:13px;font-weight:600;color:var(--ink2)}.mp.on{background:var(--ink);color:#fff}
.sl{display:flex;align-items:center;gap:10px;margin-top:14px}.trk{flex:1;height:6px;border-radius:3px;background:var(--acc);position:relative}.trk::after{content:'';position:absolute;right:-2px;top:-7px;width:20px;height:20px;border-radius:50%;background:#fff;border:2px solid var(--acc);box-shadow:0 2px 6px rgba(0,0,0,.15)}.sl b{font-size:13px;width:38px;text-align:right}
.tone{display:flex;justify-content:space-between;margin-top:14px;font-size:13.5px;color:var(--ink3)}.tone span:last-child{color:var(--acc);font-weight:600}
.wseg{margin:0 16px 16px 60px}
.del{margin-top:24px;background:var(--card);border-radius:20px;padding:16px;display:flex;justify-content:center;align-items:center;gap:6px;color:#f04452;font-weight:600;font-size:15px;box-shadow:0 2px 12px rgba(15,23,42,.03)}

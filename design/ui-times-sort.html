<!doctype html><html lang="ko"><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,"Noto Sans KR",sans-serif;background:#e9ebef;padding:24px;width:960px;color:#1d2330}
h1{font-size:20px;font-weight:900;margin-bottom:4px}.sub{font-size:13px;color:#6b7280;margin-bottom:14px;line-height:1.5}
.row{display:flex;gap:20px}.c{flex:1;background:#fff;border-radius:18px;padding:14px;box-shadow:0 6px 18px rgba(0,0,0,.08)}
.c h2{font-size:16px;font-weight:900;margin-bottom:4px}.c p{font-size:12.5px;color:#6b7280;margin-bottom:10px;line-height:1.45;min-height:54px}
.c img{width:100%;border-radius:12px;border:1px solid #e5e7eb;display:block}
</style></head><body>
<h1>근무 시간 · 상태 — 쉬는 시간을 시간 순서대로</h1>
<div class="sub">예: 야간에 📖 교육 오후 9~10시, ☕ 쉬는 시간 새벽 3시 추가</div>
<div class="row">
<div class="c"><h2>지금</h2><p>추가한 칸이 늘 야식 아래에 붙음 → 시간 순서가 뒤죽박죽<br>흐름 막대에 "근무" 글자가 잘려서 "무"만 보임</p><img src="tt_now.png"></div>
<div class="c"><h2>바꾼 뒤</h2><p>시간을 고르면 그 시간 자리로 저절로 이동 (근무 시작 기준, 밤 넘어가도 맞게)<br>근무 중 쉬는 칸은 왼쪽 보라 줄로 묶어 보이게 · 막대는 아이콘만</p><img src="tt_sort.png"></div>
</div></body></html>

<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:#e9ebef;padding:28px;color:#1d2330;width:1180px}
h1{font-size:20px;font-weight:900;margin-bottom:4px}
.sub{font-size:13px;color:#6b7280;margin-bottom:18px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.card{background:#fff;border-radius:22px;padding:18px;box-shadow:0 6px 18px rgba(0,0,0,.08);display:flex;flex-direction:column;gap:12px}
.card h2{font-size:17px;font-weight:900}
.card p{font-size:12.5px;color:#6b7280;line-height:1.5;min-height:38px}
.big{display:flex;gap:14px;align-items:center;justify-content:center;background:#f6f7f9;border-radius:16px;padding:16px 0}
.big div{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;color:#6b7280;font-weight:700}
.cell{display:flex;gap:6px}
.c{width:62px;height:76px;border:1px solid #eceef1;border-radius:6px;background:#fff;display:flex;flex-direction:column;align-items:center;padding:3px}
.c .dn{align-self:stretch;display:flex;align-items:center;justify-content:space-between;font-size:11px;font-weight:600;padding:0 2px}
.c .dn span{display:flex;gap:2px;align-items:center}
.c .k{margin-top:6px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:11.5px;background:#c9d6dd;color:#33505e}
.dark{background:#16181d}.dark .c{background:#1d2027;border-color:#2c3038;color:#e8eaee}
.lbl{font-size:11.5px;font-weight:800;color:#6b7280}
.pick{margin-top:auto;text-align:center;font-size:13px;font-weight:900;color:#7b5cf0}
</style></head><body>
<h1>💊 알약 아이콘 시안 — 하루 3번 기준 (0 · 1 · 2 · 3번 먹음)</h1>
<div class="sub">위: 크게 / 아래: 실제 달력 칸 크기 (라이트 · 다크)</div>
<div class="grid" id="g"></div>
<script>
const RED='#ef4d5a',RED2='#ff8a93';
// A. 두 색 캡슐(기울임) + 아래 점
function A(n,k,s){s=s||1;const w=22*s,h=22*s;
  const dots=[...Array(n)].map((_,i)=>`<circle cx="${11-(n-1)*2.6+i*5.2}" cy="20" r="1.8" fill="${i<k?RED:'#d5d8de'}"/>`).join('');
  const full=k>=n;
  return `<svg width="${w}" height="${h}" viewBox="0 0 22 22"><g transform="rotate(-35 11 9)">
    <rect x="3" y="5" width="16" height="8" rx="4" fill="#fff" stroke="${full?RED:'#c4c8cf'}" stroke-width="1.2"/>
    <path d="M7 5h4v8H7a4 4 0 0 1 0-8z" fill="${k>0?RED:'#e5e7eb'}"/>
    <rect x="5" y="6.2" width="5" height="1.4" rx=".7" fill="#fff" opacity=".55"/></g>${dots}</svg>`;}
// B. 둥근 알약(정제) 파이 채우기
function B(n,k,s){s=s||1;const w=18*s;
  const r=7,cx=9,cy=9;let p='';
  for(let i=0;i<n;i++){const a0=-Math.PI/2+i*2*Math.PI/n,a1=a0+2*Math.PI/n;const x0=cx+r*Math.cos(a0),y0=cy+r*Math.sin(a0),x1=cx+r*Math.cos(a1),y1=cy+r*Math.sin(a1);
    p+=n===1?`<circle cx="9" cy="9" r="7" fill="${k?RED:'#fff'}"/>`:`<path d="M${cx} ${cy}L${x0} ${y0}A${r} ${r} 0 0 1 ${x1} ${y1}Z" fill="${i<k?RED:'#fff'}" stroke="#fff" stroke-width=".8"/>`;}
  return `<svg width="${w}" height="${w}" viewBox="0 0 18 18"><circle cx="9" cy="9" r="7.6" fill="#fff" stroke="${RED}" stroke-width="1.3"/>${p}<circle cx="9" cy="9" r="7.6" fill="none" stroke="${RED}" stroke-width="1.3"/><ellipse cx="6.5" cy="5.6" rx="2.2" ry="1.1" fill="#fff" opacity=".5"/></svg>`;}
// C. 💊 이모티콘 + 작은 숫자
function C(n,k,s){s=s||1;const f=14*s;return `<span style="position:relative;display:inline-block;font-size:${f}px;line-height:1;${k>=n?'':'filter:grayscale(${k?.3:1});opacity:'+(k?1:.45)}">💊<b style="position:absolute;right:-${5*s}px;bottom:-${3*s}px;font-size:${8*s}px;background:${k>=n?RED:'#6b7280'};color:#fff;border-radius:${5*s}px;padding:0 ${2*s}px;font-weight:900">${k>=n?'✓':k+'/'+n}</b></span>`;}
// D. 칸으로 나뉜 가로 캡슐 (둥글게, 그라데이션)
function D(n,k,s){s=s||1;const w=22*s,h=12*s;let seg='';
  for(let i=0;i<n;i++){const x=1+20*i/n,ww=20/n;seg+=`<rect x="${x}" y="1" width="${ww}" height="10" fill="${i<k?'url(#gd)':'#f3f4f6'}"/>`;}
  const ln=[...Array(n-1)].map((_,i)=>`<line x1="${1+20*(i+1)/n}" y1="2" x2="${1+20*(i+1)/n}" y2="10" stroke="#fff" stroke-width="1.2"/>`).join('');
  return `<svg width="${w}" height="${h}" viewBox="0 0 22 12"><defs><linearGradient id="gd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${RED2}"/><stop offset="1" stop-color="${RED}"/></linearGradient><clipPath id="cd"><rect x="1" y="1" width="20" height="10" rx="5"/></clipPath></defs>
    <g clip-path="url(#cd)">${seg}${ln}<rect x="3" y="2.3" width="15" height="2" rx="1" fill="#fff" opacity=".45"/></g><rect x="1" y="1" width="20" height="10" rx="5" fill="none" stroke="${k>=n?RED:'#d1d5db'}" stroke-width="1"/></svg>`;}
const V=[['A','두 색 캡슐 + 점',A,'진짜 캡슐 느낌. 아래 점(●●○)이 먹은 횟수'],['B','둥근 알약 (파이)',B,'정제 모양을 3등분 · 2등분, 먹은 만큼 칠해짐 — 작은 칸에서도 잘 보임'],['C','💊 + 숫자',C,'익숙한 이모티콘에 2/3 숫자, 다 먹으면 ✓'],['D','칸 나뉜 캡슐 (지금 것 다듬음)',D,'둥근 그라데이션 · 칸 사이 흰 줄 · 하이라이트']];
document.getElementById('g').innerHTML=V.map(([id,name,f,desc])=>`<div class="card"><h2>${id}. ${name}</h2><p>${desc}</p>
  <div class="big">${[0,1,2,3].map(k=>`<div>${f(3,k,2.4)}${k}/3</div>`).join('')}</div>
  <div class="big" style="padding:10px 0">${[0,1,2].map(k=>`<div>${f(2,k,2)}${k}/2</div>`).join('')}</div>
  <div class="lbl">달력 칸 크기</div>
  <div class="cell">${[3,2,0].map((k,i)=>`<div class="c"><div class="dn">${12+i}<span>${f(3,k,id==='B'?0.8:id==='C'?0.85:0.7)}${i===0?'<span style="font-size:10px">🏃</span>':''}</span></div><span class="k">주</span></div>`).join('')}</div>
  <div class="cell dark" style="padding:6px;border-radius:8px">${[3,1].map((k,i)=>`<div class="c"><div class="dn">${12+i}<span>${f(3,k,id==='B'?0.8:id==='C'?0.85:0.7)}</span></div><span class="k" style="background:#3b4a55;color:#d3e2ea">주</span></div>`).join('')}</div>
  </div>`).join('');
</script>
</body></html>

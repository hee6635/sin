<!doctype html><html lang="ko"><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Pretendard,-apple-system,"Noto Sans KR",sans-serif;background:#f2f4f6;width:390px;padding:16px 12px;color:#191f28}
.t{font-size:15px;font-weight:800;margin:14px 6px 8px}.t small{font-weight:500;color:#8b95a1;font-size:12.5px;margin-left:6px}
.card{background:#fff;border-radius:22px;padding:14px 16px 16px}
.hd{display:flex;align-items:center;justify-content:space-between;height:30px;margin-bottom:6px}
.hd span{font-size:13px;color:#8b95a1;font-weight:600}
.it{display:flex;gap:10px;align-items:center;padding:8px 2px}.dot{width:10px;height:10px;border-radius:50%;background:#7b5cf0}
.it b{font-size:15px;font-weight:600}
.bar{display:flex;gap:10px;margin-top:8px}.in{flex:1;height:46px;border-radius:15px;background:#f2f4f6;color:#b0b8c1;font-size:15px;display:flex;align-items:center;padding:0 14px}.sd{width:46px;height:46px;border-radius:50%;background:#d1d6db}
.a0{color:#3182f6;font-size:14px;font-weight:700}
.a1{font-size:13px;font-weight:700;color:#4e5968;background:#f2f4f6;border-radius:999px;padding:6px 10px 6px 12px;display:flex;align-items:center;gap:2px}
.a1 i{font-style:normal;color:#8b95a1;font-size:15px;margin-top:-1px}
.a2{width:30px;height:30px;border-radius:50%;background:#f2f4f6;display:flex;align-items:center;justify-content:center}
.a2 svg,.a3 svg{width:16px;height:16px;stroke:#4e5968;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.a3{font-size:13px;font-weight:700;color:#3182f6;background:#e8f3ff;border-radius:999px;padding:6px 10px 6px 12px;display:flex;align-items:center;gap:3px}
.a3 svg{stroke:#3182f6;width:14px;height:14px}
</style></head><body>
<script>
const opts=[['지금','파란 글자','<span class="a0">자세히</span>'],
['1','회색 알약 + ›','<span class="a1">자세히<i>›</i></span>'],
['2','동그란 아이콘만 (펼치기)','<span class="a2"><svg viewBox="0 0 24 24"><path d="M14 4h6v6M10 20H4v-6M20 4l-7 7M4 20l7-7"/></svg></span>'],
['3','연한 파랑 알약 + 아이콘','<span class="a3">자세히<svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></span>']];
document.write(opts.map(([n,d,b])=>`<div class="t">${n}<small>${d}</small></div><div class="card"><div class="hd"><span>메모</span>${b}</div><div class="it"><span class="dot"></span><b>바이올린 공개수업</b></div><div class="bar"><div class="in">나만 보는 메모</div><div class="sd"></div></div></div>`).join(''));
</script></body></html>

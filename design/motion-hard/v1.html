<!doctype html><html lang="ko"><head><meta charset="utf-8"><style>
@font-face{font-family:P;src:url(../../app/src/main/assets/fonts/PretendardVariable.woff2)}
*{box-sizing:border-box;margin:0}body{font-family:P,sans-serif;background:#dfe2e6;padding:16px;display:grid;grid-template-columns:repeat(4,260px);gap:16px;width:max-content}

.ph{width:260px;height:563px;border-radius:22px;overflow:hidden;background:#f2f4f6;position:relative}

.home{position:absolute;inset:0;background:linear-gradient(160deg,#7aa6d8,#c5a3d9)}
.wpop{position:absolute;left:14px;right:14px;top:120px;background:#fff;border-radius:22px;padding:16px;font-size:13px}.wpop b{font-size:17px;display:block;margin-bottom:10px}.wpop i{display:block;height:34px;border-radius:10px;background:#f2f4f6;margin-top:8px}
.half{display:flex;height:100%}.half>div{flex:1;position:relative;overflow:hidden}
</style></head><body>

<!doctype html><html lang="ko"><head><meta charset="utf-8"><style>
@font-face{font-family:P;src:url(../../app/src/main/assets/fonts/PretendardVariable.woff2)}
body{margin:0;font-family:P,sans-serif;background:#e9ebef;display:flex;gap:24px;padding:24px;color:#191f28}
.ph{width:360px;height:420px;background:rgba(0,0,0,.35);border-radius:28px;position:relative;overflow:hidden}
.lb{position:absolute;top:14px;left:18px;color:#fff;font-weight:700;font-size:14px}
.sh{position:absolute;left:10px;right:10px;bottom:10px;background:#fff;border-radius:24px;padding:22px 16px 12px}
.t{font-size:19px;font-weight:700;padding:0 6px 14px}
.row{display:flex;align-items:center;gap:14px;padding:12px 6px;border-radius:14px}
.row.on{background:#f2f7ff}
.ic{width:40px;height:40px;border-radius:12px;background:#f2f4f6;display:flex;align-items:center;justify-content:center;color:#4e5968}
.row.on .ic{background:#e8f1ff;color:#3182f6}
.nm{flex:1;font-size:16px;font-weight:600}
.nm small{display:block;font-size:13px;font-weight:500;color:#3182f6;margin-top:2px}
.ck{color:#3182f6}
.cl{margin-top:8px;height:52px;border-radius:14px;background:#f2f4f6;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600;color:#4e5968}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
</style></head><body>
<div class="ph"><div class="lb">새 모양</div><div class="sh">
<div class="t">알람음</div>
<div class="row on"><div class="ic"><svg viewBox="0 0 24 24"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg></div><div class="nm">기본 알람음<small>Galaxy Bells</small></div><svg class="ck" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg></div>
<div class="row"><div class="ic"><svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></div><div class="nm">내 음악 파일</div><svg viewBox="0 0 24 24" style="color:#b0b8c1"><path d="m9 18 6-6-6-6"/></svg></div>
<div class="cl">닫기</div>
</div></div>
</body></html>

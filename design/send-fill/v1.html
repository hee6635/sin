<!doctype html><html lang="ko"><head><meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Pretendard,-apple-system,"Noto Sans KR",sans-serif;background:#f2f4f6;width:390px;height:300px;padding:40px 12px;color:#191f28}
h3{font-size:13px;color:#8b95a1;font-weight:600;margin:0 6px 10px}
.card{background:#fff;border-radius:22px;padding:16px}
.lbl{font-size:13px;color:#8b95a1;margin-bottom:10px}
.bar{display:flex;gap:10px;align-items:center}
.in{flex:1;height:50px;border-radius:16px;background:#f2f4f6;display:flex;align-items:center;padding:0 16px;font-size:16px;color:#191f28;position:relative}
.in .ph{color:#b0b8c1;position:absolute;left:16px}
.in .cur{display:inline-block;width:2px;height:20px;background:#3182f6;margin-left:1px;animation:bl 1s steps(1) infinite;vertical-align:middle}
@keyframes bl{50%{opacity:0}}
.send{width:50px;height:50px;border-radius:50%;background:#d1d6db;position:relative;overflow:hidden;flex:none;display:flex;align-items:center;justify-content:center}
.send:before{content:'';position:absolute;inset:0;background:#3182f6;transform:translateY(101%);transition:transform .4s cubic-bezier(.25,1,.5,1);border-radius:50%}
.send.on:before{transform:none}
.send svg{position:relative;width:22px;height:22px;stroke:#fff;stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round;transition:transform .4s cubic-bezier(.3,1.5,.5,1)}
.send.on svg{transform:translateY(-1px)}
.cap{margin-top:18px;font-size:13px;color:#6b7684;text-align:center;height:18px}
</style></head><body>
<h3>메모 입력 · 전송 버튼</h3>
<div class="card"><div class="lbl">메모</div>
<div class="bar"><div class="in" id="in"><span class="ph" id="ph">나만 보는 메모</span><span id="tx"></span><span class="cur"></span></div>
<div class="send" id="sd"><svg viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></svg></div></div></div>
<div class="cap" id="cap"></div>
<script>
const tx=document.getElementById('tx'),ph=document.getElementById('ph'),sd=document.getElementById('sd'),cap=document.getElementById('cap');
const word='내일 장보기';let t=600;
const set=s=>{tx.textContent=s;ph.style.display=s?'none':'';sd.classList.toggle('on',!!s);};
cap.textContent='글을 쓰기 시작하면 파란색이 차오름';
[...word].forEach((c,i)=>setTimeout(()=>set(word.slice(0,i+1)),t+=180));
t+=1200;setTimeout(()=>cap.textContent='다 지우면 내려가며 회색',t-200);
[...word].forEach((c,i)=>setTimeout(()=>set(word.slice(0,word.length-i-1)),t+=110));
t+=1100;setTimeout(()=>cap.textContent='다시 쓰면 다시 차오름',t-200);
[...'회식'].forEach((c,i)=>setTimeout(()=>set('회식'.slice(0,i+1)),t+=200));
</script></body></html>

<!doctype html><html lang="ko"><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0}body{font-family:"Noto Sans CJK KR","Noto Sans KR",sans-serif;background:#e9ebef;padding:24px;width:1640px;color:#1d2330}
h1{font-size:20px;font-weight:900;margin-bottom:4px}p.s{font-size:13px;color:#6b7280;margin-bottom:16px}
.r{display:flex;gap:20px;align-items:flex-start}.c{display:flex;flex-direction:column;align-items:center;gap:8px;width:300px}
.c b{font-size:15px}.c small{font-size:12px;color:#6b7280;text-align:center;line-height:1.45;min-height:52px}
img{width:300px;border-radius:24px;border:6px solid #1d2330;box-shadow:0 10px 24px rgba(0,0,0,.15)}
.sep{width:2px;background:#cfd3da;align-self:stretch;margin:0 8px}
</style></head><body>
<h1>다이어리 느낌 시안</h1><p class="s">앱은 안 바꾸고, 지금 화면 위에 색 · 모양만 덧씌워 본 그림이에요</p>
<div class="r">
<div class="c"><b>달력 · 지금</b><small>차가운 흰색 · 회색<br>빨간 "휴"가 또렷</small><img src="c0.png"></div>
<div class="c"><b>달력 A · 종이 톤</b><small>바탕만 따뜻한 크림색<br>(복잡해지는 건 없음)</small><img src="c1.png"></div>
<div class="c"><b>달력 B · 종이 톤 + 고리</b><small>위에 스프링 고리 두 개<br>"휴"는 조금 연하게</small><img src="c2.png"></div>
<div class="sep"></div>
<div class="c"><b>설정 · 지금</b><small>줄마다 이모티콘<br>그림체가 제각각</small><img src="s0.png"></div>
<div class="c"><b>설정 · 선 아이콘 + 종이 톤</b><small>같은 굵기 · 같은 색 선 아이콘<br>달력과 같은 크림색</small><img src="s1.png"></div>
</div></body></html>

<!-- 교대달력 v3: v2 + 동료근무(내 패턴 기준·내 조 선택) · 대근 수당 계산 · 알람 소리/진동 선택 · 화면 이미지 공유 · 백업/복원 -->
<html lang="ko">
<head>
<meta charset="utf-8">

<!-- 보안 잠금: 이 앱이 쓰는 곳(앱 안 파일 · 구글 서버 · 공휴일 자료)으로만 통신하고, 외부 스크립트 · 액자(iframe) · 폼 전송은 막음 -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com https://raw.githubusercontent.com; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<script>
/* 오류 기록 + 시작 실패 안전 화면 (본 스크립트가 못 떠도 동작하도록 따로 둠)
 * - 최근 오류 5개를 폰에만 적어 두고, 문의하기 메일에 같이 붙임 (자동으로 어디에 보내지 않음)
 * - 앱을 여는 중에 오류가 나면 빈 화면 대신 "다시 열기 · 데이터 파일로 보내기 · 새로 시작" 화면을 보여 줌 (데이터는 지우지 않음) */
(function(){
  var KE='eonjeswieo:err',KV='eonjeswieo:v1';
  window.__booted=false;
  function rd(){try{var a=JSON.parse(localStorage.getItem(KE)||'[]');return Array.isArray(a)?a:[];}catch(e){return [];}}
  function log(m,src){
    try{
      var a=rd(),t=Date.now(),l=a[a.length-1];
      m=String(m||'').slice(0,160);src=String(src||'').slice(0,60);
      if(l&&l.m===m&&t-l.t<3000)return;
      a.push({t:t,m:m,s:src});if(a.length>5)a=a.slice(-5);
      localStorage.setItem(KE,JSON.stringify(a));
    }catch(e){}
  }
  window.__logErr=log;
  window.addEventListener('error',function(e){
    var f=e&&e.filename?String(e.filename).split('/').pop():'';
    log(e&&e.message,f+(e&&e.lineno?':'+e.lineno:''));
    if(!window.__booted)crash(e&&e.message);
  });
  window.addEventListener('unhandledrejection',function(e){var r=e&&e.reason;log('promise: '+((r&&r.message)||r),'');});
  document.addEventListener('securitypolicyviolation',function(e){log('CSP '+e.violatedDirective+' '+String(e.blockedURI||'').slice(0,60),'');});
  function crash(msg){
    try{
      if(document.getElementById('crashBox'))return;
      var mk=function(t,css){var e=document.createElement('div');if(t)e.textContent=t;if(css)e.style.cssText=css;return e;};
      var box=mk('','position:fixed;left:0;top:0;right:0;bottom:0;z-index:99999;background:#fff;color:#1f2328;padding:28px 22px;overflow:auto;font:15px/1.5 sans-serif;');
      box.id='crashBox';
      box.appendChild(mk('앱을 여는 중 문제가 생겼어요','font-size:20px;font-weight:800;margin-bottom:10px'));
      box.appendChild(mk('저장해 둔 내 데이터는 지우지 않았어요. 아래 중 하나를 눌러 주세요.','margin-bottom:18px;color:#555'));
      var btn=function(t,fn,css){var b=document.createElement('button');b.textContent=t;b.style.cssText='display:block;width:100%;padding:14px;margin:0 0 10px;border:1px solid #cfd4da;border-radius:12px;background:#f5f6f8;font-size:16px;font-weight:700;'+(css||'');b.onclick=fn;box.appendChild(b);};
      btn('다시 열기',function(){location.reload();});
      btn('내 데이터를 파일로 보내 두기',function(){
        var raw='';try{raw=localStorage.getItem(KV)||'';}catch(e){}
        if(!raw){alert('저장된 데이터가 없어요');return;}
        try{if(window.AndroidBridge&&window.AndroidBridge.shareFile){window.AndroidBridge.shareFile('eonjeswieo-data.json',raw);return;}}catch(e){}
        alert('앱에서만 보낼 수 있어요');
      });
      btn('새로 시작하기 (데이터 지움)',function(){
        if(!confirm('저장된 데이터가 모두 지워져요.\n먼저 "내 데이터를 파일로 보내 두기"를 해 두셨나요?'))return;
        if(!confirm('정말 새로 시작할까요?'))return;
        try{localStorage.removeItem(KV);}catch(e){}
        location.reload();
      },'color:#d64560');
      box.appendChild(mk(String(msg||'').slice(0,120),'margin-top:14px;font-size:12px;color:#8b919a;word-break:break-all'));
      (document.body||document.documentElement).appendChild(box);
    }catch(e){}
  }
  window.__crash=crash;
})();
</script>

.badge{position:relative;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:16px;flex:none}
.bwrap .badge{width:var(--b);height:var(--b);font-size:calc(var(--b)*.40);font-weight:700;z-index:1}

.badge.sm.r{font-size:11px; font-weight:700;}
.badge .dot{position:absolute;top:-1px;left:-2px;width:8px;height:8px;border-radius:50%;background:#e5322d}
/* 근무 변경 빨간 점: 주야 글자 왼쪽. 자리는 화면 기준(px)으로 계산하고 주야 배율(--tink)로 나눠서 넣음 → 주야를 키워도 점 크기 · 간격은 그대로.
   기본 간격: 동그라미 = 칸 가장자리~동그라미 사이의 40% · 칸 채우기 = 글자에서 4px. 모양 조정 "빨간 점 좌우"(--tdot, + = 오른쪽)가 8px 단위로 더함.
   최소 간격: 요청 링이 있는 칸(동그라미)은 링 바깥 2px · 그 밖은 1px / 최대: 칸 가장자리 안쪽(이게 우선 — 칸 밖으로 안 나감) */
.bwrap .badge .dot{--dside:calc((100cqw - var(--b)*var(--tink,1))/2);--dbase:calc(var(--dside)*.4);--dmin:1px;top:50%;left:auto;right:calc(100% + min(calc(var(--dside) - 6px),max(var(--dmin),calc(var(--dbase) - var(--tdot,0)*8px)))/var(--tink,1));width:calc(5px/var(--tink,1));height:calc(5px/var(--tink,1));transform:translateY(-50%)}
html[data-cal="fill"] .bwrap .badge .dot{--dbase:calc(4px - var(--b)*var(--tink,1)*.3);--dmin:calc(var(--b)*var(--tink,1)*-.3)}   /* 칸 채우기: 글자 상자 안쪽, 글자에서 4px (글자 = 상자 폭의 약 40%) */
.cell[class*="rq-"] .bwrap .badge .dot{--dmin:calc(6px*var(--tink,1) + 2px)}
html[data-cal="fill"] .cell[class*="rq-"] .bwrap .badge .dot{--dmin:1px}
@container (max-width:46px){.bwrap .badge .dot{top:-1px;left:-2px;right:auto;width:6.5px;height:6.5px;transform:none}}

.mchk.on{background:#1f9a76;border-color:#1f9a76}
.mcard.done .tx{text-decoration:line-through;opacity:.6}

.mcard.cl .meta{color:rgba(42,36,24,.6)}
.mdet{flex:none;font-size:13px;font-weight:800;color:var(--fam);padding:0 4px;white-space:nowrap}
.pl.done{text-decoration:line-through;opacity:.7}
.tl{cursor:pointer}.tl small{display:block;font-size:12px;color:var(--muted)}
.tchipgrid{display:flex;flex-wrap:wrap;gap:8px 6px}

.stgrid button.drag{background:var(--surface);box-shadow:0 4px 14px rgba(0,0,0,.25);position:relative;z-index:5;opacity:.95}
.stgrid button.over{box-shadow:inset 0 0 0 2px var(--accent)}
.stgrid button{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.tl2.drag,.pgrid .pc.drag{background:var(--surface);box-shadow:0 4px 14px rgba(0,0,0,.25);position:relative;z-index:5;opacity:.95}
.tl2.over,.pgrid .pc.over{box-shadow:inset 0 0 0 2px var(--accent)}
.pgrid .pc{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.tdrag{font-size:24px;color:var(--muted);padding:6px 4px 6px 12px;touch-action:none;cursor:grab;user-select:none}

.tl.over{box-shadow:inset 0 3px 0 var(--accent)}

.sh-head{display:flex;align-items:center;justify-content:space-between; margin-bottom:16px;}

.time-input{font-size:34px;border:none;background:none;text-align:center;padding:4px 6px;
  width:auto;min-width:180px;max-width:100%;outline:none;color:var(--fg);
  -webkit-appearance:none;appearance:none;box-sizing:content-box;}
.time-input::-webkit-datetime-edit{padding:0}
.time-input::-webkit-datetime-edit-fields-wrapper{padding:0}

  padding:10px 16px;border-radius:20px;font-size:13px;opacity:0;pointer-events:none;transition:all .2s;z-index:60;width:max-content;max-width:90%;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* ================= 1차 추가 화면 ================= */
:root{--fam:#7b5cf0;--fam-bg:#f3f0ff;--fam-line:#d3c8ff;--fam-fg:#fff;--my:#6b7280;--my-bg:#f1f2f4;--my-line:#dfe2e6;--dd:#2f6bf0;--chol:#e8efff;--chol-fg:#3b6fd6}
/* 상단 */
#top.cal-top{grid-template-columns:92px 1fr 92px}
.cal-top .hl,.cal-top .hr{display:flex;align-items:center;gap:2px}
.cal-top .hr{justify-content:flex-end}
.hb{position:relative;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:19px;color:var(--fg)}
.hb:active{background:var(--surface)}
.hb.d{font-weight:900;font-size:18px;font-family:ui-monospace,Menlo,monospace}
.hb svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.bdg{position:absolute;top:3px;right:1px;min-width:17px;height:17px;border-radius:9px;background:var(--rest);color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center;padding:0 4px;border:2px solid var(--head-bg);line-height:1}
.bdg.pur{background:var(--fam)}
.cal-top .today-btn{font-size:14.5px;padding:0 4px;transition:opacity .08s,transform .08s}
.cal-top .today-btn:active{opacity:.45;transform:scale(.9)}   /* 눌렸다는 표시 (바로 보임) */
/* 달력 칸 메모 */
.pill-wrap{gap:1px}
.pill-wrap>*{flex:1 1 0 !important;min-height:0;max-height:var(--plmax,14px);line-height:var(--plhf,var(--plh,13px))}
.pill-wrap.full>*{max-height:var(--plmax,14px)}   /* 줄이 꽉 차도 글자 줄 높이의 1.3배까지만 (남는 높이는 여백) */
.pl.withmore{display:flex;align-items:center;gap:2px}   /* 메모가 줄 수보다 많으면 마지막 줄 끝에 "+n" 칩 (위젯 칸과 같은 표시) */
.pl .pt{flex:1 1 0;min-width:0;overflow:hidden;white-space:nowrap}
/* "+n": 알약 없이 작은 회색 글자. 글자는 10px 로 그려 두고 배율(--mck)로 줄임 — 폰 웹뷰는 8px 아래 글자를 8px 로 키워서(최소 글자 크기) 글자 크기로는 못 줄임. 폭(--mcw) · 배율은 plFit() 가 실제로 재서 정함 */
.pl .mc{flex:none;position:relative;align-self:stretch;width:var(--mcw,1.4em);font-style:normal;color:color-mix(in srgb,currentColor 85%,transparent)}
.pl .mc b{position:absolute;left:0;top:50%;font-size:10px;line-height:1;font-weight:800;white-space:nowrap;transform-origin:0 50%;transform:translateY(-50%) scale(var(--mck,.75))}
/* 글자가 칸 폭에 잘리면: 다 들어가는 마지막 글자까지만 남기고 바로 뒤에 작은 점 세 개(한 글자 폭 안쪽 · 글자 아래쪽 높이 = 보통 "…" 자리).
   점은 글자가 아니라 그림이라 최소 글자 크기와 상관없음. 자르기는 plFit() 가 실제로 재서 (원래 글은 data-full 에 두고 다시 맞출 때 되돌림) */
.pl{position:relative}
.pl .ell2{display:inline-block;width:calc(var(--plf,9px)*.62);height:calc(var(--plf,9px)*.2);margin-left:1px;vertical-align:baseline;background:radial-gradient(circle closest-side,currentColor 72%,transparent 100%) left center/33.4% 100% repeat-x;opacity:.8}
.pl{width:calc(100% - 4px);font-size:var(--plf,9px);line-height:var(--plh,13px);flex:1 1 0;min-height:0;max-height:var(--plmax,14px);border-radius:3px;padding:0 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl{border-left:2px solid var(--c,var(--my));border-radius:2px;font-weight:600;padding-left:3px;box-sizing:border-box;background:color-mix(in srgb,var(--c,var(--my)) 15%,var(--bg));color:var(--fg)}
.pl.fam{--c:var(--fam)}
.pl.my{--c:var(--my);color:color-mix(in srgb,var(--fg) 92%,var(--bg))}
@media (min-width:600px){.pl{border-left-width:3px}}
.pl[style*="--mc"]{--c:color-mix(in srgb,var(--mc) 45%,#6a6458);background:var(--mc);color:#2a2418}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pl[style*="--mc"]{background:color-mix(in srgb,var(--mc) 30%,var(--bg));color:var(--fg)}}
:root[data-theme="dark"] .pl[style*="--mc"]{background:color-mix(in srgb,var(--mc) 30%,var(--bg));color:var(--fg)}
.pl.dd{background:color-mix(in srgb,var(--dd) 14%,var(--bg));color:var(--dd);font-weight:800}
.pl,.req-pill{flex:none;text-overflow:clip}.req-pill{padding:0 2px}
@media (min-width:600px){.cell{--b:calc(min(70cqw,54px)*.68)}}
.dn.chol{background:linear-gradient(var(--chol),var(--chol)) center/100% calc(100% - 5px) no-repeat}.dn.chol .num,.dn.chol .hn{color:var(--chol-fg)}
.legend{display:flex;gap:12px;justify-content:center;padding:5px 0 4px;font-size:10.5px;color:var(--muted);flex:none}
.legend span{display:flex;align-items:center;gap:4px}.legend i{width:20px;height:9px;border-radius:2px;display:inline-block}
/* 시트 공통 */
#sheet .sbody{padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
.ibar{position:sticky;bottom:0;background:var(--bg);margin:10px -16px 0;padding:8px 12px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);z-index:3}
.ibar .irow{display:flex;align-items:center;gap:7px}

.ibar .note.fam{color:var(--fam)}

.ibar .editing a{color:var(--muted);text-decoration:underline;cursor:pointer;padding:6px 2px}
.ibar .editing .ea{display:flex;gap:14px}
.mode{display:flex;background:var(--surface);border-radius:17px;padding:3px;flex:none}
.mode button{height:30px;padding:0 9px;border-radius:15px;font-size:12px;font-weight:800;color:var(--muted);white-space:nowrap}
.mode button.on.my{background:var(--my);color:#fff}
.mode button.on.fam{background:var(--fam);color:var(--fam-fg)}
.mode button.on.k{background:var(--fg);color:var(--bg)}
.ibar input[type=text]{flex:1;min-width:0;height:40px;border-radius:20px;padding:0 14px;font-size:14.5px}
.ibar input.fam{background:var(--fam-bg);box-shadow:inset 0 0 0 1.5px var(--fam-line)}
.ibar input.my{background:var(--my-bg)}
.send{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none;color:#fff;font-size:15px}
.send.my{background:var(--my)}.send.fam{background:var(--fam);color:var(--fam-fg)}
.send svg{width:18px;height:18px;fill:currentColor}
/* 메모 카드 */
.mtabs{display:flex;gap:6px;margin:4px 0 6px}
.mtabs button{height:30px;padding:0 12px;border-radius:15px;background:var(--surface);font-size:12.5px;font-weight:700;color:var(--muted)}
.mtabs button.on{background:var(--fg);color:var(--bg)}
.mgrp{font-size:12px;font-weight:700;color:var(--muted);margin:10px 0 6px;display:flex;align-items:center;gap:5px}
.mgrp.fam{color:var(--fam)}
.mcard{border-radius:12px;padding:10px 12px;display:flex;gap:10px;align-items:flex-start;margin-bottom:8px;-webkit-touch-callout:none;cursor:pointer}
.mcard.fam{background:var(--fam-bg);box-shadow:inset 3px 0 0 var(--fam)}
.mcard.my{background:var(--my-bg)}
.mcard.sel{outline:2px solid var(--accent);outline-offset:1px}
.mcard .mt2{flex:1;font-size:14.5px;line-height:1.4;white-space:pre-wrap;word-break:break-word}
.mcard .meta{display:flex;gap:6px;align-items:center;font-size:11px;color:var(--muted);margin-top:3px}
.who{font-size:10.5px;font-weight:800;padding:1px 6px;border-radius:8px;background:var(--fam);color:var(--fam-fg)}
.who.me{background:var(--bg);color:var(--fam);box-shadow:inset 0 0 0 1px var(--fam-line)}
.conv{font-size:11px;font-weight:800;height:26px;padding:0 9px;border-radius:13px;flex:none;background:var(--bg);color:var(--fam);box-shadow:inset 0 0 0 1px var(--fam-line);white-space:nowrap}
.mempty{font-size:13px;color:var(--muted);padding:6px 2px 4px}
/* 작은 메뉴 */
#pop{position:fixed;inset:0;z-index:45;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.4)}
#pop.open{display:flex}
#pop .menu{width:calc(100% - 24px);max-width:520px;margin-bottom:calc(12px + env(safe-area-inset-bottom,0px));background:var(--bg);border-radius:18px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.25)}
#pop .mh{padding:14px 16px 10px;font-size:12.5px;color:var(--muted);border-bottom:1px solid var(--line)}
#pop .mh b{display:block;color:var(--fg);font-size:14.5px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#pop .mi{display:flex;width:100%;padding:15px 16px;font-size:15px;border-bottom:1px solid var(--line);text-align:left;gap:10px;align-items:center}
#pop .mi:last-child{border-bottom:0}
#pop .mi.f{color:var(--fam);font-weight:800}#pop .mi.d{color:var(--danger)}
#pop .mi input{flex:1}
/* 가족 소식 */
.feed-day{font-size:12px;font-weight:700;color:var(--muted);margin:12px 0 4px}
.ev{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.ev.new{background:linear-gradient(90deg,var(--fam-bg),transparent 75%);margin:0 -16px;padding:10px 16px}
.ev .ic{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:16px;flex:none;background:var(--surface)}
.ev .tx{flex:1;font-size:14px;line-height:1.4}
.ev .tx small{display:block;font-size:11.5px;color:var(--muted);margin-top:2px}
.ev .q{background:var(--surface);border-radius:10px;padding:7px 10px;margin-top:6px;font-size:13px}
.ev .btns{display:flex;gap:6px;margin-top:8px}
.ev .btns button{flex:1;height:34px;border-radius:10px;font-size:12.5px;font-weight:800;background:var(--surface)}
.ev .btns .ok{background:color-mix(in srgb,var(--st-accepted) 15%,var(--bg));color:var(--st-accepted)}
.ev .btns .no{background:color-mix(in srgb,var(--st-rejected) 13%,var(--bg));color:var(--st-rejected)}
.ev .nd{width:8px;height:8px;border-radius:50%;background:var(--fam);flex:none;margin-top:6px}
/* 월 메모 */
.todo{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.todo .cb{position:relative;width:22px;height:22px;flex:none}
.todo .cb input{position:absolute;inset:0;opacity:0;margin:0;z-index:1}
.todo .cb i{position:absolute;inset:0;border-radius:6px;box-shadow:inset 0 0 0 2px var(--track)}
.todo .cb input:checked+i{background:var(--fam);box-shadow:none}
.todo .cb input:checked+i::after{content:"✓";position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:13px;font-weight:900}
.todo .t{flex:1;font-size:15px}
.todo.done .t{color:var(--muted);text-decoration:line-through}
.todo small{display:block;font-size:11px;color:var(--muted);text-decoration:none}
.tagf{color:var(--fam);font-weight:800}.tagm{color:var(--my);font-weight:800}
.xbtn{width:30px;height:30px;display:grid;place-items:center;color:var(--muted);font-size:14px;flex:none}
/* D-day */
.dcard{border-radius:16px;padding:13px 16px;display:flex;align-items:center;justify-content:space-between;margin-top:10px;background:var(--surface)}
.dcard b{font-size:15px;display:block}.dcard small{font-size:12px;color:var(--muted)}
.dcard.auto{background:var(--today-bg);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--today) 35%,transparent)}
.dnum{font-size:24px;font-weight:900;font-family:ui-monospace,Menlo,monospace}
.drow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.drow .e{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:18px;background:var(--surface);flex:none}
.drow .tx{flex:1;min-width:0}.drow .tx b{font-size:15px;display:block}.drow .tx small{font-size:12px;color:var(--muted)}
.drow .n{font-weight:900;font-family:ui-monospace,Menlo,monospace;font-size:16px;white-space:nowrap}
.emo{display:flex;flex-wrap:wrap;gap:6px}.emo button{width:42px;height:42px;border-radius:12px;background:var(--surface);font-size:20px}
.emo button.on{box-shadow:inset 0 0 0 2px var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--bg))}
/* 전체 화면 페이지 (알람 설정, 더 보기 하위) */
#page{position:absolute;inset:0;background:var(--surface);z-index:15;transform:translateX(102%);transition:transform .22s ease;display:flex;flex-direction:column}
#page.open{transform:none}
.pg-h{display:flex;align-items:center;gap:6px;padding:10px 8px;background:var(--head-bg);border-bottom:1px solid var(--line);flex:none}
.pg-h b{flex:1;text-align:center;font-size:17px}
.pg-h button{min-width:56px;height:40px;font-size:15px;font-weight:700}
.pg-h .bk{font-size:24px;color:var(--fg);text-align:left;padding-left:8px}
.pg-h .ok{color:var(--accent)}
.pg-b{flex:1;overflow-y:auto;padding:0 0 30px}
.pg-sec{background:var(--bg);margin-top:10px}
.pg-cap{font-size:12.5px;font-weight:700;color:var(--muted);padding:16px 16px 6px}
.prow{display:flex;align-items:center;gap:10px;min-height:56px;padding:8px 16px;border-bottom:1px solid var(--line);background:var(--bg)}
.prow:last-child{border-bottom:0}
.prow .pl2{flex:1;font-size:15px;color:var(--fg)}
.prow .pl2 small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.prow .pv{color:var(--muted);font-size:14px;text-align:right}
.prow.col{flex-direction:column;align-items:stretch;gap:8px}
.prow.tap{cursor:pointer}.prow.tap:active{background:var(--surface)}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.chips button{height:34px;padding:0 13px;border-radius:17px;background:var(--surface);font-size:13.5px;font-weight:700;color:var(--muted)}
.chips button.on{background:var(--accent);color:#fff}
.chips.left{justify-content:flex-start}
.timebox{position:relative;font-size:30px;font-weight:300;letter-spacing:-1px;color:var(--fg)}
.timebox em{font-style:normal;font-size:14px;margin-right:4px;letter-spacing:0}
.timebox input{position:absolute;inset:0;opacity:0;width:100%;height:100%;padding:0}
.prow input[type=range]{width:100%;accent-color:var(--accent)}
.prow input.inl{width:150px;text-align:right;background:none;padding:6px 0;border-radius:0;color:var(--fg)}
.danger-row{justify-content:center;color:var(--danger);font-weight:700;cursor:pointer}
.mlist .mi2{display:flex;align-items:center;gap:12px;min-height:54px;padding:6px 16px;border-bottom:1px solid var(--line);cursor:pointer;background:var(--bg)}
.mlist .mi2:last-child{border-bottom:0}
.mlist .mi2 .e{width:28px;text-align:center;font-size:18px;flex:none;display:grid;place-items:center;color:var(--icon-on)}
.mlist .mi2 .e svg,.e-in svg{display:block}
.e-in{display:inline-grid;place-items:center;width:28px;margin-right:12px;vertical-align:middle;color:var(--icon-on)}
.mlist .mi2 span{flex:1;font-size:15px}
.mlist .mi2 small{color:var(--muted);font-size:12.5px}
.mlist .prow{min-height:54px;padding:6px 16px}.mlist .prow .pl2{display:flex;align-items:center;min-width:0;font-size:15px}
.policy{background:var(--bg);margin-top:10px;padding:14px 16px;font-size:14px;line-height:1.65}
.policy h4{margin:14px 0 4px;font-size:14.5px}
.swatch{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;justify-items:center}
.swatch button{width:34px;height:34px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.swatch button.on{box-shadow:0 0 0 2.5px var(--bg),0 0 0 4.5px var(--fg)}
.warnline{font-size:12px;color:var(--danger);margin-top:4px}
/* 동료근무 표 */
.ctbl{position:relative}
.crow{display:grid;grid-template-columns:62px repeat(var(--tc,4),1fr);border-bottom:1px solid var(--line);height:44px}
.crow>div{display:flex;align-items:center;justify-content:center;border-right:1px solid var(--line)}
.crow>div:last-child{border-right:0}
.crow.hd{position:sticky;top:0;z-index:4;background:var(--bg);height:38px;font-size:13.5px;font-weight:600;color:var(--muted);border-bottom:1.5px solid var(--line)}
.crow.hd .me{color:var(--fg);font-weight:800}
.crow .me{background:color-mix(in srgb,#ffd36b 16%,var(--bg))}
.crow .dt{font-size:14px;cursor:pointer}
.crow .dt.sat{color:var(--sat)}.crow .dt.sun{color:var(--sun)}.crow .dt.hol{background:var(--hol-bg);color:var(--sun)}
.crow .dt.chol{background:var(--chol);color:var(--chol-fg)}
.crow.today{background:var(--today-bg);box-shadow:inset 0 2.5px 0 var(--today),inset 0 -2.5px 0 var(--today)}
.crow.today .me{background:transparent}.crow.today .dt{font-weight:800}
.crow .badge.sm{width:30px;height:30px;font-size:13.5px;font-weight:500}
.crow .badge.sm.r{font-size:13px;font-weight:600}
/* 처음 시작 */
#onboard{position:fixed;inset:0;z-index:40;background:var(--bg);display:none;flex-direction:column}
#onboard.open{display:flex}
.ob-prog{display:flex;gap:6px;padding:16px 20px 0}.ob-prog i{flex:1;height:4px;border-radius:2px;background:var(--line)}.ob-prog i.on{background:var(--accent)}
.ob-back{padding:10px 14px 0;height:40px;font-size:24px;color:var(--muted);text-align:left}
.ob-b{flex:1;overflow-y:auto;padding:4px 20px 10px}
.ob-b h2{font-size:23px;letter-spacing:-.4px;line-height:1.35;margin:4px 0 0}
.ob-sub{color:var(--muted);font-size:14px;margin-top:6px;line-height:1.5}
.ob-f{padding:10px 20px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px}
.ob-f .btn{height:54px;font-size:16px;width:100%}
.ob-f .lk{height:40px;color:var(--muted);font-weight:700;font-size:14px}
.opt{border-radius:16px;padding:13px 14px;margin-top:10px;box-shadow:inset 0 0 0 1.5px var(--line);display:flex;align-items:center;gap:12px;cursor:pointer;width:100%;text-align:left}
.opt.on{box-shadow:inset 0 0 0 2px var(--accent);background:color-mix(in srgb,var(--accent) 6%,var(--bg))}
.opt .tx{flex:1}.opt .tx b{font-size:15.5px;display:block}.opt .tx small{font-size:12px;color:var(--muted)}
.opt .rad{width:22px;height:22px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--track);flex:none}
.opt.on .rad{box-shadow:inset 0 0 0 7px var(--accent)}
.opt .pat{display:flex;gap:3px;margin-top:6px;flex-wrap:wrap}
.opt .pat .badge{width:22px;height:22px;font-size:10.5px}
.pos{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.pos button{border-radius:14px;padding:10px 4px;text-align:center;box-shadow:inset 0 0 0 1.5px var(--line);display:flex;flex-direction:column;align-items:center;gap:4px}
.pos button .badge{width:34px;height:34px;font-size:14px}
.pos button small{font-size:11px;color:var(--muted);line-height:1.3}
.pos button.on{box-shadow:inset 0 0 0 2px var(--accent);background:color-mix(in srgb,var(--accent) 6%,var(--bg))}
.pos button.on small{color:var(--accent);font-weight:800}
.week7{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px;background:var(--surface);border-radius:14px;padding:10px 6px}
.week7 div{text-align:center;font-size:11px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:4px}
.week7 .badge{width:28px;height:28px;font-size:12px}
.week7 .t{color:var(--today);font-weight:800}
.mcal{margin-top:12px;border-radius:16px;box-shadow:inset 0 0 0 1.5px var(--line);padding:8px 6px}
.mcal .hd{text-align:center;font-weight:800;font-size:16px;padding:4px 0 6px}
.mcal .g{display:grid;grid-template-columns:repeat(7,1fr);row-gap:4px}
.mcal .dw{text-align:center;font-size:11px;font-weight:700;color:var(--muted)}
.mcal .c{display:flex;flex-direction:column;align-items:center;padding:3px 0;border-radius:8px;font-size:10.5px}
.mcal .c .badge{width:26px;height:26px;font-size:11.5px;margin-top:1px}
.mcal .c.out{opacity:.3}.mcal .c.today{background:var(--today-bg);box-shadow:inset 0 0 0 2px var(--today)}
.okline{display:flex;align-items:center;gap:8px;background:var(--today-bg);color:var(--today);border-radius:12px;padding:10px 12px;font-size:13px;font-weight:700;margin-top:12px}
.alrow{border-radius:16px;padding:12px 14px;margin-top:10px;background:var(--surface);display:flex;align-items:center;gap:12px}
.alrow .badge{width:38px;height:38px;font-size:15px}
.alrow .tx{flex:1;position:relative;text-align:left}
.alrow .tx b{font-size:22px;font-weight:400;letter-spacing:-.5px}
.alrow .tx small{display:block;font-size:12px;color:var(--muted)}
.alrow .tx input{position:absolute;inset:0;opacity:0;width:100%}
.perm{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px}
.perm .ck{width:22px;height:22px;border-radius:50%;background:var(--today);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:900;flex:none}
.perm .ck.no{background:color-mix(in srgb,var(--rest) 15%,var(--bg));color:var(--rest)}
.perm span{flex:1}.perm button{color:var(--accent);font-weight:800;font-size:13px}
.hero{display:flex;flex-direction:column;align-items:flex-start;padding-top:60px}
.hero h1{font-size:30px;margin:22px 0 0}
.hero p{color:var(--muted);margin-top:8px;font-size:15px}
.choice{background:var(--bg);border-radius:18px;padding:18px;margin-top:14px;box-shadow:0 2px 10px rgba(0,0,0,.07),inset 0 0 0 1px var(--line);display:flex;gap:14px;align-items:center;width:100%;text-align:left;cursor:pointer}
.choice .ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:22px;flex:none;background:var(--surface)}
.choice b{font-size:16px;display:block}.choice small{font-size:12.5px;color:var(--muted);display:block;margin-top:2px}
.logo-ic{width:72px;height:72px;border-radius:20px;box-shadow:0 8px 20px rgba(79,124,255,.3)}

/* 아래 탭 배지 · 가족 탭 */
#nav button{position:relative}
.nbdg{position:absolute;top:2px;left:calc(50% + 6px);min-width:17px;height:17px;border-radius:9px;background:var(--rest);color:#fff;font-size:10px;font-weight:800;font-style:normal;display:grid;place-items:center;padding:0 4px;line-height:1}
.famv{padding:4px 16px 24px}
.fam-mem{display:flex;gap:16px;padding:6px 2px 14px}
.fam-mem>div{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12.5px;font-weight:700;cursor:default}
.fam-mem>div[data-act]{cursor:pointer}
.fam-mem i{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:17px;font-weight:800;color:#fff}
.fam-mem i.me{background:var(--fg);color:var(--bg)}.fam-mem i.gu{background:var(--fam)}
.fam-mem i.add{background:var(--surface);color:var(--muted);box-shadow:inset 0 0 0 2px var(--line);font-size:22px}
.fam-mem small{font-size:10.5px;color:var(--muted);font-weight:600}
.fam-now{border-radius:16px;padding:12px 14px;background:linear-gradient(135deg,#5b4bd6,#3b6fd6);color:#fff;margin-bottom:12px}
.fam-now small{font-size:12px;opacity:.85;font-weight:700}.fam-now b{display:block;font-size:17px;font-weight:800;margin-top:2px}
.dd-link{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;margin-bottom:12px;border-radius:12px;background:color-mix(in srgb,var(--dd) 10%,var(--bg));color:var(--fg);font-size:14.5px;font-weight:700;text-align:left}
.dd-link span{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--dd);color:#fff;font-weight:900;font-family:ui-monospace,Menlo,monospace}
.dd-link small{margin-left:auto;color:var(--muted);font-weight:600;font-size:12.5px}

/* 휴무일 · 기념일 */
.hrow{gap:6px}.hrow .pl2{flex:1;min-width:0}
.hic{display:inline-block;width:22px}
.hseg{display:flex;background:var(--surface);border-radius:10px;padding:2px;flex:none}
.hseg button{font-size:12px;font-weight:700;padding:5px 8px;border-radius:8px;color:var(--muted);white-space:nowrap}
.hseg button.on{background:var(--bg);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.hseg button.on.off{color:var(--rest)}
.hseg.big{width:100%}.hseg.big button{flex:1;font-size:14px;padding:9px 0}
.xbtn.on{opacity:1}

/* 📝 월 메모 = 포스트잇 벽 */
.pi-ic{position:relative;overflow:hidden}
.pi-ic::before{content:'';position:absolute;left:6px;right:6px;top:7px;height:15px;background:repeating-linear-gradient(to bottom,transparent 0 4px,rgba(150,120,20,.55) 4px 6px)}
.pi-ic::after{content:'';position:absolute;right:0;bottom:0;width:10px;height:10px;background:linear-gradient(135deg,transparent 50%,#e2cb4f 50%)}
.hb.pi-btn>span:first-child{display:grid;place-items:center;width:30px;height:30px;background:#fff3a8;border-radius:3px 3px 9px 3px;box-shadow:0 2px 5px rgba(60,40,10,.2);transform:rotate(-4deg);font-size:15px}
:root{--pi-y:#fff3a8;--pi-g:#d6f5df;--pi-b:#d9ecff;--pi-o:#ffe0c7;--pi-k:#ffd9e4;--pi-p:#e6ddff;--pi-ink:#2a2418;--pi-wall:#f4efe6;--pi-dot:rgba(120,100,70,.10)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--pi-y:#d9c96a;--pi-g:#9fcfac;--pi-b:#a3c2e3;--pi-o:#e3b892;--pi-k:#e3a7b8;--pi-p:#b3a3ee;--pi-wall:#1f1c18;--pi-dot:rgba(255,240,210,.06)}}
:root[data-theme="dark"]{--pi-y:#d9c96a;--pi-g:#9fcfac;--pi-b:#a3c2e3;--pi-o:#e3b892;--pi-k:#e3a7b8;--pi-p:#b3a3ee;--pi-wall:#1f1c18;--pi-dot:rgba(255,240,210,.06)}
.pi-wall{background:var(--pi-wall);background-image:radial-gradient(var(--pi-dot) 1px,transparent 1px);background-size:14px 14px;padding:0 0 30px}
.pi-hd{display:flex;align-items:center;justify-content:space-between;padding:10px 8px 4px;position:sticky;top:0;z-index:3;background:var(--pi-wall)}
.pi-hd .ib{font-size:20px;color:var(--muted)}
.pi-hd .m{display:flex;align-items:center;gap:4px}.pi-hd .m b{font-size:20px;font-weight:800}.pi-hd .m .ib{font-size:24px}
.pi-sum{display:flex;gap:6px;justify-content:center;padding:2px 12px 8px;flex-wrap:wrap}
.pi-sum span{font-size:12px;font-weight:700;padding:4px 10px;border-radius:12px;background:color-mix(in srgb,var(--bg) 75%,transparent);color:var(--muted)}
.pi-sum .y{color:#a16207}.pi-sum .f{color:var(--fam)}
.pi-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px 12px;padding:14px 14px 4px;align-items:start}
@media (min-width:600px){.pi-grid{grid-template-columns:repeat(3,1fr)}}
.pi{position:relative;padding:18px 11px 11px;border-radius:3px 3px 14px 3px;box-shadow:0 6px 12px rgba(60,40,10,.14),0 1px 2px rgba(60,40,10,.12);font-size:13.5px;line-height:1.45;min-height:92px;color:var(--pi-ink);background:var(--pi-y);cursor:pointer;touch-action:pan-y;transition:opacity .15s}
.pi.c-y{background:var(--pi-y)}.pi.c-g{background:var(--pi-g)}.pi.c-b{background:var(--pi-b)}.pi.c-o{background:var(--pi-o)}.pi.c-k{background:var(--pi-k)}.pi.c-p{background:var(--pi-p)}
.pi.r1{transform:rotate(-1.4deg)}.pi.r2{transform:rotate(1.2deg)}.pi.r3{transform:rotate(-.5deg)}.pi.r4{transform:rotate(1.8deg)}
.pi.wide{grid-column:1/-1}

/* 스티커 크기: 폭에 비례, 달 전체가 한 크기 (폰 11~16px · 태블릿 최대 18px). 근무 표시는 스티커 크기 − 4px 만큼 아래로 (6~12px) → 둘째 줄 스티커가 동그라미에 살짝만 걸침 */
:root{--stz:clamp(12px,3.74vw,17.6px);--stz0:clamp(12px,3.74vw,17.6px)}
@media (min-width:600px){:root{--stz:clamp(17px,2.64vw,19.8px);--stz0:clamp(17px,2.64vw,19.8px)}}   /* --stz0: 화면 기준 스티커 크기(줄이기 전) — 날짜 줄 높이 · 주야 자리는 이걸로 정해서, 달마다 스티커를 줄여도(--stz) 주야가 안 움직임 */
.dn .stp>svg,.s2>svg,.dn .stp .sx svg,.s2 .sx svg{width:var(--stz);height:var(--stz)}
.dn .stp>.se,.s2>.se,.dn .stp .sx .se,.s2 .sx .se{font-size:calc(var(--stz) - 2px) !important}
.sx{position:relative;display:inline-block;line-height:0}

.sx .cb{position:absolute;right:calc(var(--stz,19px)*-.1);bottom:calc(var(--stz,19px)*-.14);font-size:10px;font-weight:800;font-style:normal;line-height:1;color:#fff;background:#f08a00;border-radius:7px;padding:1.3px 3.3px;white-space:nowrap;filter:none;transform-origin:100% 100%;scale:var(--cbk,.55)}   /* 1/2 배지: 글자는 10px 로 그려 두고 "배율"로 줄임 — 폰 웹뷰는 8px 아래 글자를 8px 로 키우고(최소 글자 크기) 큰 글씨도 곱해서, 글자 크기로는 못 줄임. 배율(--cbk)은 cbFit() 가 스티커 크기 × .36 에 맞춰 계산 */

.cell.pers{--b:max(34px,min(100cqw,56px,calc(100cqh - 62px)))}

.sbs{display:flex;justify-content:space-around;text-align:center;padding:6px 14px 2px}
.sbs div{font-size:12px;color:var(--muted);font-weight:700}.sbs b{display:block;font-size:24px;color:var(--fg);font-weight:900}
.sbd{margin:10px 14px;background:var(--surface);border-radius:18px;padding:14px 14px 12px}
.sbh{display:flex;align-items:center;gap:8px;margin-bottom:10px}.sbh b{font-size:16px;flex:1}.sbh .sbi{font-size:20px;display:inline-flex}
.sbc{font-size:14px;font-weight:800;color:var(--fam)}
.sbg{display:grid;grid-template-columns:repeat(11,1fr);gap:5px}
.sl{aspect-ratio:1;border-radius:50%;border:1.5px dashed var(--track);display:grid;place-items:center}
.sl small{font-size:9.5px;color:var(--muted);opacity:.75}
.sl.ft{border-style:dotted;opacity:.55}.sl.np{opacity:.3}
.sl.td{border:2px solid var(--st-accepted)}.sl.td small{color:var(--st-accepted);font-weight:900;opacity:1}
.sk{width:100%;height:100%;border-radius:50%;background:var(--bg);box-shadow:0 1px 3px rgba(0,0,0,.28),0 0 0 1.5px var(--bg);display:grid;place-items:center;font-size:14px;line-height:1}
.sk svg{width:62%;height:62%}.sk .ico{width:62%;height:62%}
.sbf{margin-top:9px;font-size:12.5px;color:var(--muted);font-weight:700}.sbf b{color:var(--fg)}
.sbmg{display:block;width:100%;text-align:center;color:var(--accent);font-weight:700;font-size:14px;padding:12px 0 22px}
/* 메모: 줄 노트 느낌 */
.mcard{border-radius:0;background:none !important;box-shadow:none !important;border-bottom:1.5px dotted var(--track);padding:13px 0 11px;margin-bottom:0;gap:12px;align-items:center}
.mcard::before{content:'';width:9px;height:9px;border-radius:50%;border:1.6px solid var(--muted);flex:none}
.mcard.fam::before{background:var(--fam);border-color:var(--fam)}
.mcard .mt2{font-size:15.5px}
.mcard.fam .tx{background:linear-gradient(transparent 58%,color-mix(in srgb,var(--fam) 26%,transparent) 58%)}
.mcard.sel{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.conv{background:none !important;box-shadow:none !important;height:auto;padding:4px 0 4px 6px;font-size:12.5px;color:var(--fam)}
.ibar{border-top:1px solid var(--line)}
.ibar input[type=text]{border-radius:0;background:none !important;box-shadow:none !important;border-bottom:1.5px solid var(--track);height:38px;padding:0 2px}
.send{background:none !important;color:var(--muted) !important;width:36px;height:36px}
.send.fam{color:var(--fam) !important}
.mode{background:none;padding:0}
.mode button{height:auto;padding:4px 6px;background:none !important;color:var(--muted) !important}
.mode button.on.my{color:var(--fg) !important}.mode button.on.fam{color:var(--fam) !important}

/* 가족 근무표 (2단계) */
.vsub{font-weight:500;color:var(--muted)}
.vcrow{display:flex;gap:8px;margin:2px 0 4px;flex-wrap:wrap}
.vchip{display:inline-flex;align-items:center;gap:7px;height:40px;padding:0 12px 0 8px;border-radius:20px;background:var(--surface);font-weight:700;font-size:14px}
.vchip i{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:11px;color:#fff;font-weight:800;overflow:hidden}
.vchip i img{width:100%;height:100%;object-fit:cover}
.vchip em{font-style:normal;color:var(--muted);margin-left:2px}
.vcchips{display:flex;gap:6px;padding:2px 16px 8px;overflow-x:auto;flex:none}
.vcchips button{height:32px;padding:0 14px;border-radius:16px;background:var(--surface);font-size:13.5px;font-weight:700;color:var(--muted);flex:none;white-space:nowrap}
.vcchips button.on{background:var(--fg);color:var(--bg)}
.vcnav{display:flex;align-items:center;justify-content:center;gap:14px;font-size:17px;padding:10px 0 4px;flex:none}
.vcnav .ib{width:36px;font-size:24px;color:var(--muted)}
.vcbox{flex:1;min-height:520px;display:flex;flex-direction:column}
.jopt{border-radius:12px;padding:11px 12px;background:var(--surface);margin-top:8px;font-size:14.5px;cursor:pointer}
.jopt small{display:block;color:var(--muted);font-size:12px;margin-top:2px;font-weight:500}
.jopt.on{outline:2px solid var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--bg))}

/* 근무 요청 상태 링 (근무 색과 따로): 답할 요청 주황 · 보류 청록 · 승인 초록 · 거절 빨강 */
.cell.rq-ask .badge{box-shadow:0 0 0 3px var(--bg),0 0 0 6px #f08a00}
.cell.rq-hold .badge{box-shadow:0 0 0 3px var(--bg),0 0 0 6px #0e9bb0}
.cell.rq-ok .badge{box-shadow:0 0 0 3px var(--bg),0 0 0 6px #1fa971}
.cell.rq-no .badge{box-shadow:0 0 0 3px var(--bg),0 0 0 6px #e0455c}

/* 달력 모양 · 모양 조정(숨은 화면): 칸 채우기 (설정 › 화면 › 달력 모양) — 칸 전체를 근무 색으로, 동그라미 없이 글자만, 오늘은 날짜 도장, 요청은 글자 주위 링 */
.cell .stp,.cell .s2{translate:calc(var(--tstkx,0)*12cqw) calc(var(--tstky,0)*8cqh);scale:var(--tstk,1);transform-origin:right center}
.dn .stp,.s2{gap:max(0px,calc(1px + var(--tgx,0)*4px))}   /* 스티커 좌우 간격 */
.dn.h1r .stp{gap:max(0px,calc(var(--tgx,0)*4px))}   /* (이름이 있는 날은 기본 0 — 위 규칙보다 구체적이라 따로 적어야 간격 조정이 먹음) */
.cell .s2{translate:calc(var(--tstkx,0)*12cqw) calc(var(--tstky,0)*8cqh + var(--tgy,0)*6cqh)}   /* 스티커 상하 간격: 둘째 줄만 아래/위로 */
.cell .pill-wrap{gap:max(0px,calc(1px + var(--tmg,0)*3px));translate:0 calc(var(--tmy,0)*4cqh)}   /* 메모 줄 사이 간격 · 위치(위 − · 아래 +) */
.bwrap .badge{scale:var(--tink,1);translate:0 calc(var(--tinky,0)*6cqh)}
html[data-cal="fill"] .grid{gap:2px;padding:2px;border-top:0}
html[data-cal="fill"] .cell{border:0;border-radius:9px;background:transparent}
.tglow{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:9;overflow:visible;color:var(--tdc,var(--accent))}
.tglow rect{fill:none;stroke:currentColor;stroke-linecap:round}
.tglow .g-soft{stroke-width:5px;opacity:0}.tglow .g-line{stroke-width:1.6px;opacity:0}

/* 오늘 숫자는 일반 날과 똑같이(알약 · 색 없음): 오늘 표시는 칸 바탕 + 아래 그림자 + 오른쪽 띠가 맡음 */
html[data-cal="fill"]{--cbm:26%}html[data-cal="fill"][data-theme="dark"]{--cbm:44%}
@media (prefers-color-scheme:dark){html[data-cal="fill"]:not([data-theme="light"]){--cbm:44%}}

html[data-cal="fill"] .bwrap .badge.c{background:transparent;color:color-mix(in srgb,var(--tb) 40%,var(--fg));font-size:calc(var(--b)*.5);font-weight:600}
html[data-cal="fill"] .cell.rq-ask .badge{box-shadow:inset 0 0 0 2.5px #f08a00}
html[data-cal="fill"] .cell.rq-hold .badge{box-shadow:inset 0 0 0 2.5px #0e9bb0}

html[data-cal="fill"] .cell.rq-no .badge{box-shadow:inset 0 0 0 2.5px #d12f4a}
/* 칸 채우기: 명절 띠는 파스텔(연한 분홍 + 장미빛 글자) · 오늘 칸은 살짝 떠오른 느낌(테두리 + 약한 그림자, 확대는 안 함) */
html[data-cal="fill"]{--hol-bg:#fcebee;--holx:#c8627a}
html[data-cal="fill"][data-theme="dark"]{--hol-bg:#3a2429;--holx:#e49aaa}
@media (prefers-color-scheme:dark){html[data-cal="fill"]:not([data-theme="light"]){--hol-bg:#3a2429;--holx:#e49aaa}}
html[data-cal="fill"] .dn.hol .hn,html[data-cal="fill"] .dn.hol .h1,html[data-cal="fill"] .hnb{color:var(--holx);font-weight:700}
html[data-cal="fill"] .dn.hol{border-radius:9px 9px 0 0}
/* 칸 채우기 · 오늘 표시(모양 조정 화면에서 고름: data-today a/b/c/d). 띠는 칸의 둥근 오른쪽 선을 따라 휘어서 끝이 가늘어짐 */
html[data-cal="fill"] .cell.today::after{content:"";display:block;position:absolute;inset:0;border:0;border-right:var(--tdw,4px) solid color-mix(in srgb,var(--tdc,var(--accent)) var(--tdp,55%),transparent);border-radius:9px;box-sizing:border-box;z-index:-1;pointer-events:none}   /* 가장 아래층: 스티커 · 메모 · 글자 어느 것과 겹쳐도 그것들이 위에 보임 */
html[data-cal="fill"][data-today="a"]{--tdw:3px;--tdp:42%}
html[data-cal="fill"][data-today="b"]{--tdw:4px;--tdp:55%}
html[data-cal="fill"][data-today="c"]{--tdw:6px;--tdp:80%}
html[data-cal="fill"][data-today="d"]{--tdw:4px;--tdp:55%}
html[data-cal="fill"][data-today="a"] .cell.today,html[data-cal="fill"][data-today="d"] .cell.today{z-index:3;box-shadow:0 5px 8px -4px rgba(0,0,0,.28)}
html[data-cal="fill"][data-today="a"] .cell.today{background:color-mix(in srgb,var(--accent) 10%,var(--bg))}
html[data-cal="fill"][data-today="a"] .cell.today[style*="--cb"]{background:color-mix(in srgb,var(--accent) 10%,color-mix(in srgb,var(--cb) var(--cbm),var(--bg)))}
html[data-cal="fill"][data-today="a"][data-theme="dark"] .cell.today{background:color-mix(in srgb,var(--accent) 18%,var(--bg))}
html[data-cal="fill"][data-today="a"][data-theme="dark"] .cell.today[style*="--cb"]{background:color-mix(in srgb,var(--accent) 18%,color-mix(in srgb,var(--cb) var(--cbm),var(--bg)))}
@media (prefers-color-scheme:dark){html[data-cal="fill"][data-today="a"]:not([data-theme="light"]) .cell.today{background:color-mix(in srgb,var(--accent) 18%,var(--bg))}html[data-cal="fill"][data-today="a"]:not([data-theme="light"]) .cell.today[style*="--cb"]{background:color-mix(in srgb,var(--accent) 18%,color-mix(in srgb,var(--cb) var(--cbm),var(--bg)))}}
html[data-cal="fill"] .cell.today .pill-wrap{padding:0 2px;box-sizing:border-box}
.tdc-row{display:flex;gap:8px;align-items:center;padding:4px 0}.tdc-row .tdc{width:24px;height:24px;border-radius:50%;border:2px solid transparent;padding:0;flex:none;box-shadow:0 0 0 1px var(--line)}.tdc-row .tdc.on{border-color:var(--fg)}.tdc-pick{position:relative;background:conic-gradient(#e0455c,#f08a00,#1fa971,#2f6bf0,#8a65c9,#e0455c);overflow:hidden}.tdc-pick input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}.tn-top{position:sticky;top:0;z-index:5;background:var(--bg);padding-bottom:4px;box-shadow:0 6px 12px rgba(0,0,0,.10)}.tn-bar{display:flex;align-items:center;gap:6px;padding:6px 12px 0}.tn-bar .btn{padding:6px 12px;font-size:13px;flex:none}.tn-bar .btn[disabled]{opacity:.4}.tn-st{flex:1;font-size:12px;color:var(--muted)}.tn-st.dirty{color:#d9534f;font-weight:700}.tn-warn{padding:2px 14px 0;font-size:12px;color:#c0392b}.tn-warn:empty{display:none}.tn-d summary{font-size:13px;font-weight:700;padding:6px 0;cursor:pointer}.tn-d{border-top:1px solid var(--line)}.tn-prev{height:140px;display:flex;flex-direction:column;border-radius:0;overflow:hidden;background:var(--bg);margin:8px 0 0}
.tn-g{padding:8px 14px 4px}.tn-g h4{margin:10px 0 2px;font-size:14px}
.tn-row{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:13px}.tn-row span{flex:0 0 112px}.tn-row input{flex:1}.tn-row b{flex:0 0 40px;text-align:right;font-variant-numeric:tabular-nums}
#top.cal-top{grid-template-columns:minmax(0,1fr) auto minmax(0,1fr)}
.rqhp{display:inline-flex;align-items:center;height:26px;padding:0 9px;border-radius:13px;font-size:12.5px;font-weight:800;margin-left:4px;white-space:nowrap;color:#fff}
.rqhp.ask{background:#f08a00}.rqhp.hold{background:#0e9bb0}
.feed-day .gcnt{background:#f08a00;color:#fff;border-radius:9px;padding:0 7px;font-size:11.5px;line-height:18px;margin-left:4px}
.mq-tag{display:inline-block;font-size:11.5px;font-weight:800;border-radius:8px;padding:1px 8px;margin-top:4px}
.mq-tag.hold{background:color-mix(in srgb,#0e9bb0 16%,var(--bg));color:#0e9bb0}
.frqsum{display:flex;justify-content:space-between;width:100%;padding:12px 14px;border-radius:14px;background:color-mix(in srgb,#f08a00 12%,var(--bg));color:#9a5a00;font-weight:800;font-size:14px;text-align:left}
.ev .tx b{font-weight:800}
.ev .q{background:none;padding:0;margin-top:2px;color:var(--muted);font-size:12.5px}
/* 접근성: 작은 버튼은 보이는 크기는 그대로 두고 누르는 자리만 최소 44px 로 넓힘 (a11yPass 가 --tx · --ty 를 정함) */
.tapx{position:relative}
.tapx::after,.tapz::after,.tapb::before{content:"";position:absolute;left:calc(-1 * var(--tx,0px));right:calc(-1 * var(--tx,0px));top:calc(-1 * var(--ty,0px));bottom:calc(-1 * var(--ty,0px))}
</style>
</head>
<body>
<div id="app">
  <header id="top"></header>
  <main id="view"></main>
  <nav id="nav" role="tablist" aria-label="메뉴">
    <button data-tab="cal"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>달력</button>
    <button data-tab="fam"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20v-1a5 5 0 0 1 5-5h3a5 5 0 0 1 5 5v1"/><circle cx="17.5" cy="9.5" r="2.5"/><path d="M17 14.2a4 4 0 0 1 4.5 4V20"/></svg>가족<i class="nbdg" id="famBadge"></i></button>
    <button data-tab="alarm"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="7.5"/><path d="M12 9v4.5l3 1.5M4 5.5l3-2.5M20 5.5l-3-2.5"/></svg>알람</button>
    <button data-tab="set"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>설정</button>
  </nav>

  <div id="share-action-bar">
    <div class="shrow"><label class="shm"><input type="checkbox" id="shareMemo"> 📝 가족 메모 넣기</label><label class="shm"><input type="checkbox" id="shareStk"> ⭐ 스티커 넣기</label></div>

    <button class="btn ghost grow" data-act="copy-share">복사하기</button>

  <div id="scrim" data-act="close"></div>

</div>

<div id="onboard"></div>

<script src="firebase/config.js"></script>
<script>
(()=>{
'use strict';

/* ================= 기본 도구 ================= */
//#HELPERS_START
const $=(s,r=document)=>r.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const fmt=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
const addK=(k,n)=>fmt(addDays(parse(k),n));
const isWknd=k=>{const w=parse(k).getDay();return w===0||w===6;};
const dayNum=d=>Math.round(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const DOW=['일','월','화','수','목','금','토'];
/* ---- 받은 값 검사 ----
 * 가족이 서버에 올린 값 · 백업 파일 · 깨진 저장 값은 그대로 믿지 않고, 모양이 맞는 것만 씀 (화면에 그리기 전에 한 번 걸러냄) */
const isObj=v=>!!v&&typeof v==='object'&&!Array.isArray(v);
const okDate=v=>typeof v==='string'&&/^\d{4}-\d\d-\d\d$/.test(v);
const okTime=v=>typeof v==='string'&&/^\d{1,2}:\d\d$/.test(v);
const okId=v=>typeof v==='string'&&/^[A-Za-z0-9_.:\-]{1,100}$/.test(v);
const okHex=v=>typeof v==='string'&&/^#[0-9a-fA-F]{6}$/.test(v);
const okImg=v=>typeof v==='string'&&v.length<=300000&&/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+\/=]+$/.test(v);
const FAM_IMG=/^data:image\/jpeg;base64,[A-Za-z0-9+\/=]{1,6000}$/;
const cutTxt=(v,n)=>String(v==null?'':v).replace(/[\u0000-\u001f\u007f]/g,' ').slice(0,n);   // 한 줄 글 (이름 등)
const cutMulti=(v,n)=>String(v==null?'':v).replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f\u007f]/g,'').slice(0,n);   // 줄바꿈이 있는 글 (메모 등)
const safeColor=(c,fb)=>(c===''||c==='v:day'||c==='v:night'||okHex(c))?c:(fb===undefined?'':fb);
const REQ_STS=['pending','accepted','rejected','applied','cancelled'];
function famCleanStkDef(d){   // 가족이 올린 스티커 종류 한 개 (자리 번호가 어긋나지 않게 못 쓰는 것은 null)
  if(!isObj(d))return null;
  const i=cutTxt(d.i,20);
  if(d.k==='p')return {i,k:'p',t:Math.max(1,Math.min(3,Math.round(+d.t)||1)),c:/^#[0-9a-fA-F]{3,8}$/.test(d.c||'')?d.c:'#7e57c2',h:['r','t','d','c'].includes(d.h)?d.h:'c'};
  const o={i,k:'m',e:cutTxt(d.e,8)||'⭐'};
  if(typeof d.img==='string'&&FAM_IMG.test(d.img))o.img=d.img;
  return o;
}
function famCleanSched(v){   // 가족 근무표 한 건 → 모양이 맞는 것만 남긴 새 객체 (근무표로 못 쓰면 null)
  if(!isObj(v)||!okDate(v.anchor))return null;

/* ================= 한국 공휴일 =================
 * 양력 공휴일과 대체공휴일은 규칙으로 계산하고,
 * 음력 명절(설날·부처님오신날·추석)은 아래 표에 직접 적어둡니다. (2025~2030 확인 완료)
 * → 해마다 6월쯤 나오는 '월력요항'을 보고 다음 해를 한 줄 추가하세요.
 * 선거일·임시공휴일은 EXTRA_HOL 에 추가하세요.
 * (규칙: 'SS'=토·일과 겹치면 대체, 'S'=일요일과 겹칠 때만, 'N'=대체 없음, 다른 공휴일과 겹치면 모두 대체 1일)
 */
//#HOL_START
const LUNAR={
  2025:['2025-01-29','2025-05-05','2025-10-06'],   // 지난 해도 달력에서 볼 수 있게 (수당 · 근무 확인)
  2026:['2026-02-17','2026-05-24','2026-09-25'],   // 설날, 부처님오신날, 추석
  2027:['2027-02-07','2027-05-13','2027-09-15'],
  2028:['2028-01-27','2028-05-02','2028-10-03'],
  2029:['2029-02-13','2029-05-20','2029-09-22'],
  2030:['2030-02-03','2030-05-09','2030-09-12']
};
const EXTRA_HOL={'2025-01-27':'임시공휴일','2025-06-03':'대통령선거일','2026-06-03':'지방선거일','2028-04-12':'국회의원선거'};
const holCache={};
function computeHol(y){
  const bases=[];
  const one=(name,m,d,rule)=>bases.push({name,dates:[`${y}-${pad(m)}-${pad(d)}`],rule});
  one('신정',1,1,'N');
  one('삼일절',3,1,'SS');
  if(y>=2026)one('노동절',5,1,'SS');
  one('어린이날',5,5,'SS');
  one('현충일',6,6,'N');
  if(y>=2026)one('제헌절',7,17,'SS');
  one('광복절',8,15,'SS');
  one('개천절',10,3,'SS');
  one('한글날',10,9,'SS');
  one('성탄절',12,25,'SS');
  const L=LUNAR[y];
  if(L){
    bases.push({name:'설날',dates:[addK(L[0],-1),L[0],addK(L[0],1)],rule:'S'});
    bases.push({name:'부처님오신날',dates:[L[1]],rule:'SS'});
    bases.push({name:'추석',dates:[addK(L[2],-1),L[2],addK(L[2],1)],rule:'S'});
  }
  for(const [k,n] of Object.entries(EXTRA_HOL)){if(k.startsWith(y+'-'))bases.push({name:n,dates:[k],rule:'N'});}
  const on={};
  bases.forEach(b=>b.dates.forEach(k=>{(on[k]=on[k]||[]).push(b);}));
  const anchors=[];
  for(const [k,list] of Object.entries(on)){
    const w=parse(k).getDay(),overlap=list.length>1;
    let need=false;
    for(const b of list){
      if(b.rule==='SS'&&(overlap||w===0||w===6))need=true;
      if(b.rule==='S'&&(overlap||w===0))need=true;
    }
    if(need){
      let anchor=k;
      for(const b of list){const last=b.dates[b.dates.length-1];if(last>anchor)anchor=last;}
      anchors.push(anchor);
    }
  }
  anchors.sort();
  const res={};
  for(const [k,list] of Object.entries(on)){
    res[k]=list.map(b=>(b.dates.length>1&&k!==b.dates[1])?'연휴':b.name).join('·');
  }
  for(const a of anchors){
    let c=addK(a,1);
    while(isWknd(c)||res[c])c=addK(c,1);
    res[c]='대체공휴일';
  }
  return res;
}

function sleepWins(from,n){

function buildSchedule(days,only){
  days=days||60;
  const now=new Date(),out=[],list=only||S.alarms;
  const t0=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  for(let i=-1;i<=days+1;i++){
    const d=addDays(t0,i),sh=shiftOf(d);
    list.forEach((a,idx)=>{
      if(!a.on)return;
      if(a.shift!=='*'&&a.shift!==sh)return;
      const [h,mi]=a.time.split(':').map(Number);
      const at=new Date(d.getFullYear(),d.getMonth(),d.getDate()+(a.offset||0),h,mi,0,0);
      if(at<=now)return;
      if(a.once&&a.until&&at.getTime()>a.until)return;
      if(a.noHol){const kk=fmt(at);if(holName(kk)||compHol(kk))return;}
      if(a.skipAt&&at.getTime()===a.skipAt)return;
      out.push({at,a,d,idx,sh});
    });
  }
  out.sort((x,y)=>x.at-y.at);
  return out.slice(0,400);
}

function linkParts(text){
  text=String(text||'');const out=[],re=/(https?:\/\/[^\s<>"']+|www\.[^\s<>"']+)/gi;let last=0,m;
  while((m=re.exec(text))){
    let u=m[0];while(u&&/[.,;:!?)\]}>]$/.test(u))u=u.slice(0,-1);
    if(u.length<5){continue;}
    if(m.index>last)out.push({t:text.slice(last,m.index)});
    out.push({u});last=m.index+u.length;re.lastIndex=last;
  }
  if(last<text.length)out.push({t:text.slice(last)});
  return out;
}

// 예전 D-day 자리: 달력 칸·날짜 화면에 이름만 보여주는 기념일
function ddayHits(k){
  if(!ad('comp'))return [];
  return (S.companyHols||[]).filter(x=>x.kind==='memo'&&(x.date===k||(x.yearly&&x.date.slice(5)===k.slice(5)&&k>=x.date)));
}
function ddayNext(x){
  const t=fmt(new Date());
  if(!x.yearly)return x.date;
  const y=new Date().getFullYear();
  let k=`${y}${x.date.slice(4)}`;
  if(k<t)k=`${y+1}${x.date.slice(4)}`;
  return k;
}
function dDiff(k){return dayNum(parse(k))-dayNum(new Date());}
function ddayLabel(x){
  const n=dDiff(ddayNext(x));
  if(n===0)return 'D-day';
  if(n>0)return `D-${n}`;
  return `+${-n+1}일`;
}

const stzPx=()=>{const w=innerWidth;return w>=600?Math.max(17,Math.min(19.8,w*.0264)):Math.max(12,Math.min(17.6,w*.0374));};
function memoLines(){
  const tab=innerWidth>=600,g=document.querySelector('#view .grid');   // (모양 조정 미리보기 같은 다른 화면의 달력 말고 메인 달력만 잼)
  const ch=g&&g.clientHeight?g.clientHeight/6:(innerHeight-230)/6;

  const bw=(document.querySelector('.track .cell .bwrap')||{}).offsetHeight||(S.personal?50:32);
  const shift=S.personal?0:Math.max(6,Math.min(12,stzPx()-4));
  const avail=ch-dnH-bw-shift;
  const want=3;   // 메모는 어디서든(폰 · 태블릿 · 개인 캘린더) 최대 3줄 — 칸이 낮으면 들어가는 만큼만
  const minLh=tab?14:12,capLh=tab?24:20,capFs=tab?14:12.5;

  const n=pl.length-mx,out=pl.slice(0,mx),s=out[mx-1],i=s.indexOf('>');

// 손가락이 바로 전 날로 되돌아오면 방금 지나온 날은 긋기 전 모습으로
function paintUndoLast(){
  const k=pdrag.path.pop();
  if(!pdrag.path.includes(k)){
    const o=pdrag.orig[k];if(o===undefined)delete S.overrides[k];else S.overrides[k]=o;

let glowPrevMk=null,glowBoot=true,glowStart=0,glowMk=-1,glowRaf=0,glowTm=0;
const GLOW_MS=820;
function glowStop(){clearTimeout(glowTm);cancelAnimationFrame(glowRaf);glowRaf=0;glowStart=0;document.querySelectorAll('.tglow').forEach(e=>e.remove());}
function glowCheck(){
  const mk=cur.y*12+cur.m,n=new Date(),nowMk=n.getFullYear()*12+n.getMonth();
  const go=mk===nowMk&&(glowBoot||(glowPrevMk!==null&&glowPrevMk!==mk));
  if(mk!==glowMk&&glowStart)glowStop();
  glowPrevMk=mk;glowBoot=false;
  if(go&&!paint&&!sharing){glowStop();glowMk=mk;glowTm=setTimeout(()=>{if(cur.y*12+cur.m!==mk||tab!=='cal')return;if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;glowStart=performance.now();window.__glowN=(window.__glowN||0)+1;glowFrame();},150);}
  else if(glowStart&&mk===glowMk&&!glowRaf)glowFrame();   // 도는 중에 다시 그려졌으면(같은 달) 새 칸에 이어서
}
function glowSvg(c){
  const w=c.clientWidth,h=c.clientHeight;if(!(w>4&&h>4))return null;
  const g=1.2,bw=w-2*g,bh=h-2*g,r=Math.max(4,Math.min(bw/2,bh/2,(parseFloat(getComputedStyle(c).borderTopLeftRadius)||8)-g));
  const per=2*Math.max(0,bw-2*r)+2*Math.max(0,bh-2*r)+2*Math.PI*r,len=per*.3,N=7;
  const R=(cls,x='')=>`<rect class="${cls}" x="${g}" y="${g}" width="${bw}" height="${bh}" rx="${r}" ry="${r}"${x}/>`;
  let d=R('g-halo',` stroke-dasharray="${len} ${per*2}"`);for(let i=1;i<=N;i++)d+=R('g-dash',` data-l="${len*i/N}" stroke-dasharray="${len*i/N} ${per*2}"`);
  const e=document.createElementNS('http://www.w3.org/2000/svg','svg');
  e.setAttribute('class','tglow');e.setAttribute('viewBox',`0 0 ${w} ${h}`);e.setAttribute('aria-hidden','true');
  e.innerHTML=R('g-soft')+R('g-line')+d;e.dataset.per=per;e.dataset.len=len;c.appendChild(e);return e;
}
function glowFrame(){
  glowRaf=0;if(!glowStart)return;
  const t=Math.min(1,(performance.now()-glowStart)/GLOW_MS);
  const c=document.querySelector('#track .panel:nth-child(2) .cell.today');
  if(!c||tab!=='cal'||cur.y*12+cur.m!==glowMk){glowStop();return;}
  let e=c.querySelector('.tglow');if(!e)e=glowSvg(c);if(!e){glowStop();return;}
  if(t>=1){glowStop();return;}
  const per=+e.dataset.per,len=+e.dataset.len;
  const env=t<.15?t/.15:Math.pow(1-(t-.15)/.85,1.6);
  e.querySelector('.g-soft').style.opacity=(env*.19).toFixed(3);e.querySelector('.g-line').style.opacity=(env*.47).toFixed(3);
  const q=Math.min(1,t/.72),p=q<.5?2*q*q:1-2*(1-q)*(1-q),head=p*(per+len);
  e.querySelector('.g-halo').style.strokeDashoffset=len-head;
  e.querySelectorAll('.g-dash').forEach(x=>{x.style.strokeDashoffset=(+x.dataset.l)-head;});
  glowRaf=requestAnimationFrame(glowFrame);
}
// "오늘" 버튼: ‹ › 처럼 이번 달 쪽으로 바로 미끄러지고(옆 칸에 이번 달을 넣고 넘김), 무거운 다시 그리기는 미끄러진 뒤에 → 누르자마자 반응함

/* ================= 근무 시간 · 지금 상태 ================= */
/* 근무타입마다 시간. 안 고치면 "대략"(아래 기본값), 고친 칸만 S.shiftTimes[k] 에 저장
 * {start, end, leave(집에서 나서기), home(집 도착), meal:{on,from,to}, sleep:{on,from,to}, breaks:[{from,to}]} */
const tm2m=t=>{const [h,m]=String(t||'0:0').split(':').map(Number);return (h||0)*60+(m||0);};
const m2tm=m=>{m=((m%1440)+1440)%1440;return `${pad(Math.floor(m/60))}:${pad(m%60)}`;};
function defaultTimes(k){
  const t=typeOf(k),nm=t.noGuess?'':(t.name||'')+k;
  let start='09:00',end='18:00',meal={on:true,from:'12:00',to:'13:00'},sleep={on:false,from:'09:00',to:'14:00'};
  if(/야|夜|night/i.test(nm)){start='19:00';end='07:00';meal={on:true,from:'00:00',to:'01:00'};sleep={on:true,from:'08:30',to:'13:30'};}
  else if(/주간|^주|주$/.test(nm)){start='07:00';end='19:00';meal={on:true,from:'12:00',to:'13:00'};}
  else if(/당직|24/.test(nm)){start='09:00';end='09:00';meal={on:true,from:'12:00',to:'13:00'};sleep={on:true,from:'10:30',to:'15:30'};}
  return {start,end,leave:m2tm(tm2m(start)-30),home:m2tm(tm2m(end)+30),meal,sleep,breaks:[]};
}
function timesOf(k){
  const d=defaultTimes(k),c=(S.shiftTimes||{})[k]||{};
  const o=Object.assign({},d,c);
  o.meal=Object.assign({},d.meal,c.meal);o.sleep=Object.assign({},d.sleep,c.sleep);o.breaks=c.breaks||d.breaks;
  // 시작 · 끝만 고쳤으면 나서기 · 도착도 따라감
  if(c.start&&!c.leave)o.leave=m2tm(tm2m(o.start)-30);
  if(c.end&&!c.home)o.home=m2tm(tm2m(o.end)+30);
  return o;
}
const timesCustom=k=>Object.keys((S.shiftTimes||{})[k]||{}).length>0;
const workTypes=()=>(S.types||[]).filter(t=>!t.rest);
const ST_DEF={commute:['🚗','출근 중'],work:['🏭','근무 중'],meal:['🍱','점심 시간'],night:['🍗','야식 시간'],brk:['☕','쉬는 시간'],back:['🚗','퇴근 중'],home:['🏠','집에 왔어요'],sleep:['😴','자는 중'],rest:['🙂','쉬는 중'],end:['🏁','근무 끝']};
const ROW_DEF={commute:'집에서 나서기',work:'근무 시작',end:'근무 끝',home:'집 도착',sleep:'수면'};   // 근무 시간 화면 줄 이름 (바꾸면 labels[key].n)
const rowName=key=>((S.status.labels||{})[key]||{}).n||ROW_DEF[key];

// 한 근무날의 시각들(밀리초)
function dayPlan(d,k){
  const t=timesOf(k),base=new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime(),at=m=>base+m*60000;
  const s=tm2m(t.start);let e=tm2m(t.end);if(e<=s)e+=1440;
  let lv=tm2m(t.leave);if(lv>s)lv-=1440;
  let hm=tm2m(t.home);while(hm<e)hm+=1440;

// 약 모양 4가지(shape): caps 캡슐(기본) · round 둥근 알약 · tab 납작 정제 · drop 물약. 하루 n번이면 n칸(캡슐 · 정제는 가로, 둥근 알약은 조각, 물약은 차오르는 양)으로 나눠 먹은 칸만 약 색으로 채움 (안 먹은 날은 그 색의 연한 테두리)
let pillSeq=0;
function pillSvg(n,k,px,col,shape){
  n=Math.max(1,Math.min(3,n||1));k=Math.max(0,Math.min(n,k||0));px=px||14;const RED=col||'#ef4d5a',id='pc'+(++pillSeq);let p='';
  const ln=(x1,y1,x2,y2)=>`<line class="pd" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`;
  if(shape==='round'){
    const r=8.4,c=11,pt=a=>`${(c+r*Math.cos(a)).toFixed(2)} ${(c+r*Math.sin(a)).toFixed(2)}`;
    if(k>=n)p=`<circle cx="11" cy="11" r="${r}" fill="${RED}"/>`;
    else for(let i=0;i<k;i++){const a0=-Math.PI/2+i*2*Math.PI/n,a1=a0+2*Math.PI/n;p+=`<path d="M11 11L${pt(a0)}A${r} ${r} 0 0 1 ${pt(a1)}Z" fill="${RED}"/>`;}
    if(n>1)for(let i=0;i<n;i++){const a=-Math.PI/2+i*2*Math.PI/n;p+=ln(11,11,(c+r*Math.cos(a)).toFixed(2),(c+r*Math.sin(a)).toFixed(2));}
    p+=`<circle class="pr" cx="11" cy="11" r="${r}" fill="none"/>`;
  }else if(shape==='tab'){
    const sg=17/n;p=`<defs><clipPath id="${id}"><ellipse cx="11" cy="11" rx="9" ry="6.2"/></clipPath></defs><g clip-path="url(#${id})">`;
    for(let i=0;i<k;i++)p+=`<rect x="${(2.5+i*sg).toFixed(2)}" y="3" width="${sg.toFixed(2)}" height="16" fill="${RED}"/>`;
    p+=`</g>`;for(let i=1;i<n;i++)p+=ln((2.5+i*sg).toFixed(2),5,(2.5+i*sg).toFixed(2),17);
    p+=`<ellipse class="pr" cx="11" cy="11" rx="9" ry="6.2" fill="none"/>${n===1?`<line class="pr" x1="11" y1="6.5" x2="11" y2="15.5" stroke="${k>=n?'#fff':RED}"/>`:''}`;   // 가운데 홈 줄은 1번짜리만 (2 · 3번은 칸 나눔 줄과 겹쳐 세로줄이 많아 보임)
  }else if(shape==='drop'){
    const d='M11 2.5C11 2.5 4.2 10 4.2 14.2a6.8 6.8 0 0013.6 0C17.8 10 11 2.5 11 2.5z';
    p=`<defs><clipPath id="${id}"><path d="${d}"/></clipPath></defs><g clip-path="url(#${id})"><rect x="0" y="${(21-(k/n)*19).toFixed(2)}" width="22" height="22" fill="${RED}"/></g>`;
    for(let i=1;i<n;i++){const y=(21-(i/n)*19).toFixed(2);p+=ln(5,y,17,y);}
    p+=`<path class="pr" d="${d}" fill="none"/>`;
  }else{
    const w=20,sg=w/n;
    p=`<defs><clipPath id="${id}"><rect x="1" y="6" width="${w}" height="10" rx="5"/></clipPath></defs><g transform="rotate(-40 11 11)"><g clip-path="url(#${id})">`;
    for(let i=0;i<k;i++)p+=`<rect x="${(1+i*sg).toFixed(2)}" y="6" width="${sg.toFixed(2)}" height="10" fill="${RED}"/>`;
    if(k>=n)p+=`<rect x="3" y="7.2" width="9" height="2" rx="1" fill="#fff" opacity=".4"/>`;
    p+='</g>';for(let i=1;i<n;i++)p+=ln((1+i*sg).toFixed(2),6,(1+i*sg).toFixed(2),16);
    p+=`<rect class="pr" x="1" y="6" width="${w}" height="10" rx="5" fill="none"/></g>`;
  }

// 스티커가 그날 "할 일"로 깔리는지: 이날만(dates) · 매일 · 요일 · 근무 맞춤(휴무 날만/근무 날만) + 기간 · 공휴일 빼기 · 야간 날 빼기 · 건너뛴 날(skip)
function stampPlanned(s,k){
  if((s.skip||[]).includes(k))return false;
  if((s.dates||[]).includes(k))return true;
  if(!((!s.from||k>=s.from)&&(!s.to||k<=s.to)))return false;
  const d=parse(k);let on=false;
  if(s.rep==='daily')on=true;
  else if(s.rep==='dow')on=(s.days||[]).includes(d.getDay());
  else if(s.rep==='month'){const md=s.mday||(s.from?parse(s.from).getDate():1);on=d.getDate()===Math.min(md,new Date(d.getFullYear(),d.getMonth()+1,0).getDate());}   // 31일 없는 달은 말일
  else if(s.rep==='work'){if(!persOn(k)){const r=isRest(shiftOf(d));on=s.workMode==='work'?!r:r;}}
  if(on&&s.noHol&&(holName(k)||compHol(k)))on=false;
  if(on&&s.noWknd&&(d.getDay()===0||d.getDay()===6))on=false;
  return on;
}
const pillActive=(s,k)=>s.kind==='pill'&&stampPlanned(s,k);
const markPlanned=(s,k)=>s.kind==='mark'&&stampPlanned(s,k);
function stampRule(s){
  const r=s.rep==='daily'?'매일':s.rep==='month'?`매달 ${s.mday||(s.from?parse(s.from).getDate():1)}일`:s.rep==='dow'?([1,2,3,4,5,6,0].filter(w=>(s.days||[]).includes(w)).map(w=>DOW[w]).join('·')||'요일 없음'):s.rep==='work'?(s.workMode==='work'?'근무 날만':'휴무 날만'):'이날만';
  const ex=[s.noHol?'공휴일 빼기':'',s.noWknd?'토 · 일 빼기':'',s.to&&s.rep!=='none'&&s.rep!=='once'?`~${+s.to.slice(5,7)}/${+s.to.slice(8)}`:''].filter(Boolean).join(' · ');
  return (stN(s)>1?`하루 ${stN(s)}번 · `:'')+r+(ex?' · '+ex:'');
}

  };

  const c=cellOf(k);if(c)c.classList.add('selTop');   // 팝업이 떠 있는 동안 칸 위쪽 1/3 은 눌린 채로
}
function toastUndo(msg,fn){

  toast._undo=fn;clearTimeout(toast._t);toast._t=setTimeout(()=>{t.classList.remove('show','act');toast._undo=null;},3500);

// 약 기록 보존: 먹음 표시를 하는 순간 그날 기록에 그때의 색 · 횟수 · 모양을 같이 저장 → 나중에 약 설정을 바꿔도 이미 표시한 날은 그대로
const stSnap=(k,id)=>((S.stamps.snap||{})[k]||{})[id];
const stView=(s,k)=>{const sn=s.kind==='pill'&&k?stSnap(k,s.id):null;return {N:sn?sn.t:stN(s),col:sn?sn.c:s.color,shape:sn?sn.h:(s.shape||'caps')};};
function stampSet(id,k,v){

function stampRegSave(){

      :{id:uid(),kind:'mark',emoji:d.emoji||'🏃',name:'새 스티커',times:1,rep:'none',from:'',to:'',days:[],dates:[],skip:[],ats:[]};
    track(d.kind==='pill'?'sticker_pill':'sticker_mark');if(d.kind==='pill')S.stamps.defs.unshift(s);else S.stamps.defs.push(s);

    if(d.rep==='month')s.mday=parse(d.from||d.k).getDate();

// 반복 스티커가 깔리는 날 중 하루 한도(2개 · 설정 4개) 때문에 가려지는 날 수 (앞으로 200일 안)
function stampHidden(s,from,to){
  let n=0,first='',names='',mv=0,mvFirst='',mvNames='';
  for(let i=0;i<=200;i++){
    const k=addK(from,i);if(to&&k>to)break;
    if(!stampPlanned(s,k))continue;
    const on=stampsOn(k);
    if(!on.some(x=>x.s.id===s.id)){n++;if(!first){first=k;names=on.map(x=>x.s.name).join(' · ');}}
    else{   // 새 스티커는 보이는데 앞선 칸이라 기존 스티커가 밀려나는 날
      const lost=stampsOn(k,s.id).filter(x=>!on.some(y=>y.s.id===x.s.id));
      if(lost.length){mv++;if(!mvFirst){mvFirst=k;mvNames=lost.map(x=>x.s.name).join(' · ');}}

}
let hidSnap=null;

const stampCnt=(k,id)=>((S.stamps.log[k]||{})[id])||0;
// 그 날짜에 보일 스티커 (반복으로 깔린 것은 흐리게, 기록은 찍은 것), 하루 4개까지 (설정에 앞선 칸이 먼저). skipId = 그 스티커가 없다고 치고 계산
function stampsOn(k,skipId){
  const out=[];
  S.stamps.defs.forEach(s=>{
    if(s.id===skipId||s.empty)return;
    const V=stView(s,k),n=Math.min(V.N,stampCnt(k,s.id));
    if(n||(!s.retired&&stampPlanned(s,k)))out.push({s,n,v:V,k});
  });
  return out.slice(0,stampMax());
}
// 활동 스티커: 덜 한 것(1/2 · 1/3 · 2/3)만 작은 숫자 배지, 다 하면 스티커만 진하게 (약은 알약 조각으로 보이니 배지 없음)
const stampIcon=(x,px)=>{
  const s=x.s,V=x.v||stView(s,null),N=V.N,n=Math.min(x.n,N),sid=` data-sid="${s.id}"`;
  const ic=s.kind==='pill'?pillSvg(N,n,px||14,V.col,V.shape):`<span class="se ${n?'':'plan'}"${px?` style="font-size:${px-2}px"`:''}>${ico(s.emoji)}</span>`;
  if(s.kind!=='pill'&&N>1&&n>0&&n<N)return `<span class="sx"${sid}>${ic}<i class="cb">${n}/${N}</i></span>`;
  return ic.replace(/^<(svg|span)/,`<$1${sid}`);
};
// 방금 붙인 스티커가 종이에 붙듯 "톡" (애니메이션 줄이기를 켠 폰에서는 효과 · 진동 모두 없음)
function stkPop(k,id){

// 날짜 화면 맨 위 스티커 줄
function stampRow(k){

function stampTap(id,k){
  const s=S.stamps.defs.find(x=>x.id===id);if(!s)return;
  const lg=S.stamps.log[k]||(S.stamps.log[k]={}),n=lg[id]||0;
  const shown=stampsOn(k).map(x=>x.s.id);

  const Nn=stView(s,k).N;lg[id]=n>=Nn?0:n+1;if(s.kind==='pill'&&lg[id]===Nn)toast(`💊 ${s.name} 오늘 다 먹었어요`);

/* ---- 스티커판: 한 달에 모은 스티커를 한 판에서 ---- */
let sbY=0,sbM=0;
const stkDone=(s,k)=>stampCnt(k,s.id)>=stN(s);
const stkPlan=(s,k)=>stampCnt(k,s.id)>0||(s.kind==='pill'?pillActive(s,k):markPlanned(s,k));
function stkMonth(y,m){const days=new Date(y,m+1,0).getDate();let tot=0;S.stamps.defs.forEach(s=>{for(let d=1;d<=days;d++)if(stkDone(s,fmt(new Date(y,m,d))))tot++;});return tot;}
function stkStreak(s,from){let d=new Date(from.getFullYear(),from.getMonth(),from.getDate()),n=0;if(!stkDone(s,fmt(d)))d=addDays(d,-1);while(stkDone(s,fmt(d))&&n<400){n++;d=addDays(d,-1);}return n;}
function stkBest(s,y,m){let b=0,c=0;const days=new Date(y,m+1,0).getDate();for(let d=1;d<=days;d++){if(stkDone(s,fmt(new Date(y,m,d)))){c++;b=Math.max(b,c);}else c=0;}return b;}
function openStickerBoard(y,m){
  const now=new Date(),isCur=y===now.getFullYear()&&m===now.getMonth(),tk=fmt(now);
  sbY=y;sbM=m;
  const days=new Date(y,m+1,0).getDate(),rot=[-6,4,-3,7,-8,2,5,-4,6,-2,3];
  const total=stkMonth(y,m),prev=stkMonth(m?y:y-1,m?m-1:11),diff=total-prev;
  const cards=S.stamps.defs.map(s=>{
    let done=0,plan=0,slots='';
    for(let d=1;d<=days;d++){
      const k=fmt(new Date(y,m,d)),dn=stkDone(s,k),pl=stkPlan(s,k),n=stampCnt(k,s.id);
      if(dn)done++;if(pl)plan++;
      const ic=s.kind==='pill'?pillSvg(stN(s),n,16,s.color,s.shape):ico(s.emoji);
      if(n>0)slots+=`<div class="sl"><div class="sk" style="transform:rotate(${rot[d%11]}deg)">${ic}</div></div>`;
      else slots+=`<div class="sl ${k===tk?'td':''} ${k>tk&&pl?'ft':''} ${pl?'':'np'}"><small>${d}</small></div>`;
    }
    if(!done&&!plan)return '';
    const foot=isCur?`연속 <b>${stkStreak(s,now)}일</b> · 이번 달 최고 <b>${stkBest(s,y,m)}일</b>`:`그 달 최고 연속 <b>${stkBest(s,y,m)}일</b>`;
    return `<div class="sbd"><div class="sbh"><span class="sbi">${s.kind==='pill'?pillSvg(stN(s),stN(s),20,s.color,s.shape):ico(s.emoji)}</span><b>${esc(s.name)}</b><span class="sbc">${plan?`${done}/${plan}일`:`${done}번`}</span></div><div class="sbg">${slots}</div><div class="sbf">${foot}</div></div>`;
  }).join('');
  const best=Math.max(0,...S.stamps.defs.map(s=>isCur?stkStreak(s,now):stkBest(s,y,m)));
  openPage(`${pageHead('스티커판')}<div class="pg-b">
    <div class="sbm"><button class="ib" data-act="sb-prev" aria-label="이전 달">‹</button><b>${y}년 ${m+1}월</b><button class="ib" data-act="sb-next" aria-label="다음 달">›</button></div>
    <div class="sbs"><div><b>${total}</b>이번 달 스티커</div><div><b>${best}일</b>${isCur?'연속':'최고 연속'}</div><div><b>${diff>0?'+':''}${diff}</b>지난달보다</div></div>
    ${cards||'<div class="hint" style="padding:30px 20px;text-align:center">아직 붙인 스티커가 없어요<br>달력 칸 위쪽을 눌러 붙여 보세요</div>'}
    <button class="sbmg" data-act="more-stamps">스티커 관리 ›</button></div>`,'sboard');
}

const OFF_NAME={'-1':'전날','0':'','1':'다음날'};
function renderAlarm(){
  const sched=buildSchedule(60),n=sched[0];
  const nextFire={};
  sched.forEach(x=>{if(!(x.a.id in nextFire))nextFire[x.a.id]=x.at.getTime();});
  const nextHtml=S.alarms.length?'':`<div class="next"><div class="big">알람이 없어요</div><div class="sub muted">오른쪽 위 + 로 근무에 맞춘 알람을 추가해보세요</div></div>`;
  const now0=Date.now();
  const order=[...S.alarms].sort((x,y)=>(nextFire[x.id]??8.64e15)-(nextFire[y.id]??8.64e15));
  const cards=order.map(a=>{
    const t=ampm(a.time),iColor=a.on?'var(--icon-on)':'var(--icon-off)';
    const vibOn=a.on&&a.vib!==false,sndOn=a.on&&a.sound!==false;
    const vibSvg=`<svg viewBox="0 0 24 24" fill="none" stroke="${vibOn?iColor:'var(--icon-off)'}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect>${vibOn?'<path d="M1 12h2M21 12h2M3 8h1M20 8h1M3 16h1M20 16h1"></path>':'<line x1="2" y1="2" x2="22" y2="22"></line>'}</svg>`;
    const sndSvg=`<svg viewBox="0 0 24 24" fill="none" stroke="${sndOn?iColor:'var(--icon-off)'}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>${sndOn?'<path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>':'<line x1="23" y1="1" x2="1" y2="23"></line>'}</svg>`;
    const vol=sndOn?Math.max(8,Math.round((a.vol??100)*.6)):60;
    return `
    <div class="acard ${a.on?'':'off'}" data-act="aedit" data-id="${a.id}">
      <div class="acard-left">
        <div class="acard-top">
          <span class="ap">${t.ap}</span><span class="tm">${t.tm}</span>
          ${a.shift==='*'?'<span class="badge sm r" style="margin-left:4px;">매일</span>':badge(a.shift,'sm','')}
        </div>
        <div class="icon-row">
          ${OFF_NAME[String(a.offset||0)]?`<span style="font-size:13px;font-weight:600;color:${iColor};margin-right:4px;">${OFF_NAME[String(a.offset||0)]}</span>`:''}
          ${a.once?`<span style="font-size:12px;font-weight:700;color:${iColor};margin-right:4px;">한 번만</span>`:''}
          ${vibSvg}${sndSvg}
          <div class="vol-bar" style="width:${vol}px;background:${sndOn?'var(--icon-on)':'var(--icon-off)'};"></div>
        </div>
        ${a.label?`<div class="am">${esc(a.label)}</div>`:''}
        <div class="aleft">${!a.on?'꺼짐':nextFire[a.id]?`⏱ ${remain(nextFire[a.id]-now0)} 후에 울려요`:'두 달 안에 울릴 날이 없어요'}${a.noHol?' · 공휴일 쉼':''}</div>
        ${a.on&&a.skipAt>now0?`<div class="askip">⏭ ${(()=>{const x=new Date(a.skipAt);return `${x.getMonth()+1}/${x.getDate()} ${ampm(a.time).ap} ${ampm(a.time).tm}`;})()} 한 번 건너뜀 <button data-act="askip-undo" data-id="${a.id}">되돌리기</button></div>`
          :a.on&&nextFire[a.id]&&!a.once&&nextFire[a.id]-now0<24*3600e3?`<button class="askip-btn" data-act="askip" data-id="${a.id}">이번만 끄기</button>`:''}
      </div>
      <label class="sw"><input type="checkbox" data-act="atoggle" data-id="${a.id}" ${a.on?'checked':''}><i></i></label>
    </div>`;
  }).join('');

  return `${issueHtml}${nextHtml}
    ${S.alarms.length?'<div class="list-header"><span>곧 울리는 순</span><span class="all-off" data-act="alloff">전체 끄기</span></div>':''}
    <div>${cards}</div>`;
}

function okEmoji(t){
  t=String(t||'').trim();if(!t||/[0-9A-Za-z\u3131-\u318E\uAC00-\uD7A3\s]/.test(t)||!/\p{Extended_Pictographic}/u.test(t))return false;
  const n=(typeof Intl!=='undefined'&&Intl.Segmenter)?[...new Intl.Segmenter().segment(t)].length:Array.from(t).length;

}
// 내 것: 직접 입력한 이모티콘을 이름과 함께 모아 둠 (최대 20개 · 같은 이모티콘은 앞으로)

function myEmoDel(i){if(!Array.isArray(S.myEmo)||!S.myEmo[i])return;S.myEmo.splice(i,1);save();icnPull();renderIcn();toast('지웠어요');}

let crp=null;
function openCrop(src){
  const img=new Image();
  img.onload=()=>{
    crp={img,z:1,ox:0,oy:0,box:0,pts:new Map(),d0:0,z0:1};
    openPop(`<div class="mh">사진 맞추기<b>끌어서 옮기고, 아래 막대로 크기 조절</b></div>
      <div class="crp"><div class="crp-box" id="crpBox"><img id="crpImg" src="${src}" alt="" draggable="false"><i class="crp-ring"></i></div></div>
      <div class="mi crp-z"><span>－</span><input type="range" id="crpZoom" min="1" max="4" step="0.01" value="1"><span>＋</span></div>
      <div class="mi crp-pv"><div><img id="cpv1" class="ico" style="font-size:12px" alt="">달력 칸</div><div><img id="cpv2" class="ico" style="font-size:23px" alt="">스티커 창</div><div><img id="cpv3" class="ico" style="font-size:38px" alt="">가족 · 고르기</div></div>
      <div class="mi" style="gap:8px"><button class="btn ghost grow" data-act="crp-again">다시 고르기</button><button class="btn grow" data-act="crp-ok">이걸로 정하기</button></div>`);
    requestAnimationFrame(()=>{const b=$('#crpBox');if(!b||!crp)return;crp.box=b.clientWidth;cropDraw();});
  };
  img.onerror=()=>toast('사진을 열지 못했어요');
  img.src=src;
}
// 사진이 동그라미 칸을 꽉 채우도록 (빈 곳 안 생기게) 옮기는 범위를 막음
function cropFit(){
  const c=crp,iw=c.img.naturalWidth||1,ih=c.img.naturalHeight||1,base=c.box/Math.min(iw,ih),W=iw*base*c.z,H=ih*base*c.z;
  const mx=(W-c.box)/2,my=(H-c.box)/2;c.ox=Math.max(-mx,Math.min(mx,c.ox));c.oy=Math.max(-my,Math.min(my,c.oy));
  return {k:base*c.z,W,H,left:(c.box-W)/2+c.ox,top:(c.box-H)/2+c.oy};
}
function cropDraw(){
  if(!crp||!crp.box)return;const f=cropFit(),im=$('#crpImg');
  if(im){im.style.width=f.W+'px';im.style.height=f.H+'px';im.style.transform=`translate(${f.left}px,${f.top}px)`;}
  clearTimeout(crp.pt);crp.pt=setTimeout(()=>{if(!crp)return;const u=cropOut(96);['cpv1','cpv2','cpv3'].forEach(id=>{const e=$('#'+id);if(e)e.src=u;});},50);
}
// 128×128 정사각형 JPEG 로 줄여서 (한 장에 5KB 안팎) · 투명한 곳이 있는 그림(투명 PNG)은 투명을 살려 PNG 로 (너무 크면 흰 바탕 JPEG)
function cropOut(size){
  const f=cropFit(),cv=document.createElement('canvas');cv.width=cv.height=size;
  const g=cv.getContext('2d');
  const draw=()=>g.drawImage(crp.img,-f.left/f.k,-f.top/f.k,crp.box/f.k,crp.box/f.k,0,0,size,size);
  if(/^data:image\/(png|webp|gif)/.test(crp.img.src||'')){
    draw();
    try{
      const px=g.getImageData(0,0,size,size).data;let clear=false;
      for(let i=3;i<px.length;i+=4)if(px[i]<250){clear=true;break;}
      if(clear){const u=cv.toDataURL('image/png');if(u.length<=28000)return u;}
    }catch(e){}
    g.clearRect(0,0,size,size);
  }
  g.fillStyle='#fff';g.fillRect(0,0,size,size);draw();
  return cv.toDataURL('image/jpeg',0.86);
}
function cropOk(){
  if(!crp||!crp.box)return;
  const u=cropOut(128),id=uid();crp=null;
  (S.icons=S.icons||{})[id]=u;save();
  if(icn){icn.icon='@'+id;icn.own='';if(icn.instant){icnSave();return;}renderIcn();}else closePop();
}
function cropBack(){crp=null;if(icn)renderIcn();else closePop();}
document.addEventListener('pointerdown',e=>{const b=crp&&e.target.closest&&e.target.closest('#crpBox');if(!b)return;try{b.setPointerCapture(e.pointerId);}catch(err){}crp.pts.set(e.pointerId,{x:e.clientX,y:e.clientY});crp.d0=0;});
document.addEventListener('pointermove',e=>{
  if(!crp||!crp.pts.has(e.pointerId))return;
  const p=crp.pts.get(e.pointerId);
  if(crp.pts.size===1){crp.ox+=e.clientX-p.x;crp.oy+=e.clientY-p.y;}
  p.x=e.clientX;p.y=e.clientY;
  if(crp.pts.size===2){
    const [a,b]=[...crp.pts.values()],d=Math.hypot(a.x-b.x,a.y-b.y);
    if(!crp.d0){crp.d0=d;crp.z0=crp.z;}else{crp.z=Math.max(1,Math.min(4,crp.z0*d/crp.d0));const r=$('#crpZoom');if(r)r.value=crp.z;}
  }
  cropDraw();
});
['pointerup','pointercancel'].forEach(ev=>document.addEventListener(ev,e=>{if(crp){crp.pts.delete(e.pointerId);crp.d0=0;}}));

function unseenCount(){return feedEvents().filter(e=>!e.seen).length;}

function feedBody(){

/* 직접 추가한 가족 S.family = [{id, name, color, kind('shift'|'office'|'student'|'free'), team(같은 패턴의 조),

const FAM_COL=['#e5484d','#f59e0b','#10b981','#3b6fd6','#8b5cf6','#ec4899'];
const FAM_KIND={shift:['🔁','교대 근무'],office:['💼','평일 근무'],student:['🏫','학생'],free:['🏠','일정 없음']};
const CHEER_DEF=[['☕','수고해'],['💪','힘내'],['🍗','야식 먹어'],['❤️','사랑해']];
let famAnchor='';   // 시간표에서 마지막으로 보던 날(오늘 가운데: 가운데 날 · 주 단위: 그 주 첫날) — 다시 그려도 그 자리를 지킴
function famInit(){
  const sc=document.getElementById('fgs');if(!sc)return;
  if(!sc.clientWidth){requestAnimationFrame(()=>{if(document.getElementById('fgs')===sc&&sc.clientWidth)famInit();});return;}   // 아직 화면에 안 그려졌으면 한 번 기다림
  const heads=[...sc.querySelectorAll('.fh')],mode=sc.dataset.m,todayK=fmt(new Date());
  const w=()=>sc.clientWidth/7,idxOf=k=>heads.findIndex(h=>h.dataset.k===k);
  const defIdx=mode==='c'?idxOf(todayK):Math.max(0,idxOf(todayK)-new Date().getDay());
  let ai=famAnchor?idxOf(famAnchor):-1;if(ai<0)ai=defIdx;
  const left=mode==='c'?ai-3:ai;
  sc.scrollLeft=Math.max(0,left)*w();
  const upd=()=>{
    if(!sc.clientWidth||heads.length<7)return;
    const i=Math.max(0,Math.min(heads.length-7,Math.round(sc.scrollLeft/w())));
    const a=parse(heads[i].dataset.k),b=parse(heads[i+6].dataset.k);
    const t=document.getElementById('fwkT');if(t)t.textContent=`${a.getMonth()+1}월 ${a.getDate()}일 ~ ${b.getMonth()+1}월 ${b.getDate()}일`;
    famAnchor=heads[mode==='c'?i+3:i].dataset.k;
    const ti=idxOf(todayK),far=mode==='c'?(i+3!==ti):!(ti>=i&&ti<i+7);
    const nb=document.getElementById('fwkNow');if(nb)nb.hidden=!far;

const PI_COL=['y','g','b','o','k'];

function ensureRepeats(mk){
  const latest={};
  Object.keys(S.board).filter(k=>k<mk).sort().forEach(k=>(S.board[k]||[]).forEach(n=>{latest[n.rootId||n.id]=n;}));
  const list=S.board[mk]||[];let added=false;
  Object.entries(latest).forEach(([root,n])=>{
    if(!n.repeat||list.some(x=>(x.rootId||x.id)===root))return;
    let date='';
    if(n.date){const [y,m]=mk.split('-').map(Number),dd=new Date(y,m-1,+n.date.slice(8));if(dd.getMonth()===m-1)date=fmt(dd);}
    list.push(Object.assign({},n,{id:uid(),rootId:root,t:Date.now(),torn:false,tornAt:0,reacts:{},date,
      lines:(n.lines||[]).map(l=>({id:uid(),text:l.text,done:false,doneBy:''}))}));
    added=true;
  });
  if(added){S.board[mk]=list;save();}
}
function boardAll(mk){ensureRepeats(mk);return S.board[mk]||[];}
function boardItems(mk){const r=role();return boardAll(mk).filter(x=>!x.torn&&(x.shared||x.by===r));}

function piDetect(n,mk){
  const txt=[n.title||'',n.text||'',...(n.lines||[]).map(l=>l.text)].join(' ');
  const [y,m]=mk.split('-').map(Number);
  const ok=(Y,M,D)=>{const d=new Date(Y,M-1,D);return d.getMonth()===M-1&&d.getDate()===D?fmt(d):'';};
  let r=txt.match(/(\d{1,2})\s*\/\s*(\d{1,2})/);
  if(r){const M=+r[1],D=+r[2];if(M>=1&&M<=12)return ok(M<m-6?y+1:y,M,D);}
  r=txt.match(/(\d{1,2})\s*월\s*(\d{1,2})\s*일/);
  if(r){const M=+r[1],D=+r[2];if(M>=1&&M<=12)return ok(M<m-6?y+1:y,M,D);}
  r=txt.match(/(^|[^\d])(\d{1,2})\s*일(?!\s*(뒤|후|전|동안|간))/);
  if(r)return ok(y,m,+r[2]);
  return '';
}

  boardCarryCheck(mk);

let piEd=null;
function piTarget(){return !piEd?null:piEd.isNew?piEd.n:piFind(piEd.id);}
function piOpen(id){
  if(id){if(!piFind(id))return;piEd={isNew:false,id};}
  else piEd={isNew:true,n:{id:uid(),type:'note',title:'',lines:[],text:'',shared:role()==='guest',by:role(),color:'y',repeat:false,dateAuto:true,date:'',reacts:{},torn:false}};

function piPull(){

function piSug(n){

      ${!piEd.isNew&&n.shared?`<div class="pi-react">${PI_REACT.map(e=>`<button class="${rx[r]===e?'on':''}" data-act="pi-react" data-v="${e}">${e==='✓'?'✓ 확인':e}</button>`).join('')}</div>${seen?`<div class="pi-seen">${seen} 이 봤어요</div>`:''}`:''}
    </div>
    <div class="pi-tools">
      ${piEd.isNew?`<div class="hseg"><button class="${isList?'on':''}" data-act="pi-type" data-v="list">☑ 할 일</button><button class="${isList?'':'on'}" data-act="pi-type" data-v="note">📝 메모</button></div>`:''}
      ${own?`<div class="hseg"><button class="${n.shared?'':'on'}" data-act="pi-share" data-v="0">🔒 나만</button><button class="${n.shared?'on fam':''}" data-act="pi-share" data-v="1">♥ 가족</button></div>`:''}
      ${own&&!n.shared?`<div class="pi-cols">${PI_COL.map(c=>`<button class="c-${c} ${n.color===c?'on':''}" data-act="pi-color" data-v="${c}" aria-label="색"></button>`).join('')}</div>`:''}
      ${own?`<button class="pi-tb ${n.repeat?'on':''}" data-act="pi-repeat">🔁 매달 반복</button>`:''}

      ${!piEd.isNew&&(own||r==='host')?'<button class="pi-tb del" data-act="pi-del">🗑</button>':''}

name: 공휴일 갱신

on:
  schedule:
    - cron: "17 18 * * *"   # 매일 한국 시간 새벽 3시 17분
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 공휴일 받아오기
        env:
          KASI_KEY: ${{ secrets.KASI_KEY }}
        run: node scripts/update-holidays.mjs
      - name: 바뀌었으면 올리기
        run: |
          if [ -n "$(git status --porcelain data/)" ]; then
            git config user.name "holiday-bot"
            git config user.email "holiday-bot@users.noreply.github.com"
            git add data/holidays.json
            git commit -m "공휴일 갱신"
            git push
          fi
